<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienvenue · d’après Windows 11</title>
<link rel="stylesheet" href="../commun.css">
<link rel="stylesheet" href="../polices.css">
<style>
/*
 * Variante 2 — d'après la première mise en route de Windows 11.
 * Aurora tourne sur Windows : autant parler la langue du système. Une grande fenêtre arrondie,
 * l'illustration à gauche sur un fond doux, la question à droite en titre, une liste à sélection
 * avec la barre d'accent à gauche de l'élément choisi, et les boutons en bas à droite. Thème clair
 * de Windows, accent bleu système, Segoe UI (Noto Sans quand Segoe n'est pas là).
 */
:root { color-scheme: light; --win: 'Segoe UI Variable Text', 'Segoe UI', 'Noto Sans', sans-serif; --winT: 'Segoe UI Variable Display', 'Segoe UI', 'Noto Sans', sans-serif; --acc: #005fb8; --acc-h: #0067c0; --fond: #e9edf3; --carte: #fbfbfb; --t1: #1b1b1b; --t2: #5d5d5d; --ligne: #e5e5e5; }
body { background: linear-gradient(180deg, #edf1f7, #e3e8f0); color: var(--t1); font: 14px/1.45 var(--win); }
.fen { position: fixed; inset: 5vh 6vw; display: grid; grid-template-columns: 1fr 1fr; border-radius: 8px; background: var(--carte); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 32px 64px rgba(0, 0, 0, 0.14), 0 2px 21px rgba(0, 0, 0, 0.1); overflow: hidden; }
.illu { position: relative; display: grid; place-items: center; background: linear-gradient(160deg, #dbe7f7, #eef3fb 60%, #f7f9fc); }
.droite { display: grid; grid-template-rows: auto 1fr auto; padding: 46px 48px 28px; }
.droite h1 { margin: 0 0 6px; font: 600 28px/1.25 var(--winT); letter-spacing: -0.01em; }
.droite .sous { margin: 0 0 22px; color: var(--t2); font-size: 14px; }
.liste { margin: 0; padding: 0; list-style: none; border: 1px solid var(--ligne); border-radius: 6px; background: #fff; overflow: hidden; }
.liste li + li { border-top: 1px solid var(--ligne); }
.liste button { all: unset; box-sizing: border-box; position: relative; display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; width: 100%; padding: 13px 16px; cursor: pointer; }
.liste button:hover { background: #f5f5f5; }
.liste button[aria-checked="true"] { background: #f0f4fa; }
.liste button[aria-checked="true"]::before { content: ''; position: absolute; left: 0; top: 50%; width: 3px; height: 18px; margin-top: -9px; border-radius: 2px; background: var(--acc); }
.liste button:focus-visible { outline: 2px solid #000; outline-offset: -2px; }
.liste .ic { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; background: #eef3fb; color: var(--acc); }
.liste .ic svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.liste b { display: block; font-weight: 600; font-size: 14px; }
.liste span span { font-size: 12.5px; color: var(--t2); }
.case { display: grid; grid-template-columns: 20px 1fr; gap: 10px; margin-top: 18px; font-size: 13.5px; cursor: pointer; }
.case input { appearance: none; width: 20px; height: 20px; margin: 0; border-radius: 4px; border: 1px solid #8a8a8a; background: #fff; display: grid; place-content: center; cursor: pointer; }
.case input:checked { background: var(--acc); border-color: var(--acc); }
.case input:checked::after { content: ''; width: 10px; height: 5px; border: solid #fff; border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
.case small { display: block; color: var(--t2); font-size: 12.5px; }
.secu { display: flex; align-items: center; gap: 8px; margin-top: 18px; padding: 10px 12px; border-radius: 6px; background: #f3f3f3; font-size: 12.5px; color: var(--t2); }
.secu svg { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--t2); stroke-width: 1.7; }
.pied { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.pied a { color: var(--acc); text-decoration: none; font-size: 13.5px; cursor: pointer; }
.pied a:hover { text-decoration: underline; }
.btn { min-width: 120px; padding: 6px 20px 7px; border-radius: 4px; border: 1px solid rgba(0, 0, 0, 0.08); border-bottom-color: rgba(0, 0, 0, 0.18); background: #fff; color: var(--t1); font: 400 14px/20px var(--win); cursor: pointer; }
.btn.acc { background: var(--acc); color: #fff; border-color: rgba(255, 255, 255, 0.08); border-bottom-color: rgba(0, 0, 0, 0.4); }
.btn.acc:hover { background: var(--acc-h); }
.btn:focus-visible { outline: 2px solid #000; outline-offset: 2px; }
.etapes { position: absolute; left: 28px; top: 24px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--t2); }
.etapes .lambda { width: 16px; height: 16px; }
.points { position: absolute; left: 50%; bottom: 26px; display: flex; gap: 6px; transform: translateX(-50%); }
.points i { width: 6px; height: 6px; border-radius: 50%; background: #c2c9d4; }
.points i.ici { width: 18px; border-radius: 3px; background: var(--acc); }
/* L'illustration : un écran en volume doux, façon emoji 3D de Fluent. */
.ecranI { position: relative; width: 62%; aspect-ratio: 16 / 11; transform: rotate(-4deg); animation: flotte 6s ease-in-out infinite; }
@keyframes flotte { 50% { transform: rotate(-4deg) translateY(-8px); } }
.ecranI .cadre { position: absolute; inset: 0 0 14% 0; border-radius: 18px; background: linear-gradient(160deg, #3b3d46, #1d1e24); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.25), inset 0 -6px 12px rgba(0, 0, 0, 0.4), 0 30px 50px rgba(30, 50, 90, 0.25); }
.ecranI .dalle { position: absolute; inset: 5% 4% 18% 4%; border-radius: 10px; overflow: hidden; background: linear-gradient(140deg, #3a2a8c, #6a4cff 45%, #e34d9a); }
.ecranI .dalle::before { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0) 40%); }
.ecranI .dalle svg { position: absolute; left: 50%; top: 50%; width: 30%; transform: translate(-50%, -50%); filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3)); }
.ecranI .pied1 { position: absolute; left: 42%; right: 42%; bottom: 3%; height: 12%; border-radius: 4px; background: linear-gradient(180deg, #9aa1ad, #6f7682); }
.ecranI .pied2 { position: absolute; left: 30%; right: 30%; bottom: 0; height: 4%; border-radius: 6px; background: linear-gradient(180deg, #b7bdc8, #8d939e); box-shadow: 0 8px 14px rgba(30, 50, 90, 0.2); }
.badgeI { position: absolute; right: 16%; top: 22%; display: grid; place-items: center; width: 74px; height: 74px; border-radius: 22px; background: linear-gradient(160deg, #43c06a, #1f9a4a); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), 0 16px 26px rgba(20, 110, 50, 0.3); transform: rotate(10deg); animation: flotte2 6s 0.6s ease-in-out infinite; }
.badgeI svg { width: 36px; height: 36px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
@keyframes flotte2 { 50% { transform: rotate(10deg) translateY(-10px); } }
.etiquette { background: rgba(255, 255, 255, 0.85); color: #5d5d5d; border-color: #e0e0e0; }
</style>
</head>
<body>
<main class="fen">
  <section class="illu" aria-hidden="true">
    <div class="etapes"><span class="lambda"></span>Aurora · configuration</div>
    <div class="ecranI"><div class="cadre"></div><div class="dalle"><svg viewBox="14 13 36 39"><path d="M18 48L32 17l14 31" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="pied1"></div><div class="pied2"></div></div>
    <div class="badgeI"><svg viewBox="0 0 24 24"><rect width="16" height="10" x="4" y="11" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <div class="points"><i class="ici"></i><i></i><i></i><i></i></div>
  </section>
  <section class="droite">
    <div>
      <h1>Ton abonnement, enfin rangé. Comment veux-tu l’ajouter ?</h1>
      <p class="sous">Choisis ce que ton fournisseur t’a donné. Tu pourras ajouter d’autres comptes ensuite.</p>
      <ul class="liste" role="radiogroup" aria-label="Type d’abonnement" id="liste">
        <li><button type="button" role="radio" aria-checked="true"><span class="ic"><svg viewBox="0 0 24 24"><rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01M6 18h.01"/></svg></span><span><b>Compte Xtream</b><span>un serveur, un identifiant et un mot de passe</span></span></button></li>
        <li><button type="button" role="radio" aria-checked="false"><span class="ic"><svg viewBox="0 0 24 24"><path d="M21 5H3M11 12H3M11 19H3M15 12v7l6-3.5z"/></svg></span><span><b>Playlist M3U</b><span>une adresse en http, ou un fichier .m3u sur ce PC</span></span></button></li>
        <li><button type="button" role="radio" aria-checked="false"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></span><span><b>Restaurer une sauvegarde Aurora</b><span>le fichier .aurora rend tes comptes, tes réglages, tes favoris et ton historique</span></span></button></li>
      </ul>
      <label class="case" for="fr"><input id="fr" type="checkbox"><span>N’afficher que le français<small>Cache ce qui porte une autre langue (« EN - », « AR - »). Ce qui n’a aucune étiquette reste. Tu peux le défaire dans Réglages ▸ Catalogue.</small></span></label>
      <div class="secu"><svg viewBox="0 0 24 24"><rect width="16" height="10" x="4" y="11" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Tes identifiants sont chiffrés sur ce PC, et rien ne part ailleurs.</div>
    </div>
    <div></div>
    <div class="pied"><a>Ignorer pour le moment</a><span><button class="btn" type="button">Retour</button> <button class="btn acc" type="button">Suivant</button></span></div>
  </section>
</main>
<span class="etiquette">Variante 2 · d’après Windows 11</span>
<script>
const items = [...document.querySelectorAll('#liste button')];
items.forEach((b) => b.addEventListener('click', () => items.forEach((x) => x.setAttribute('aria-checked', String(x === b)))));
</script>
</body>
</html>
