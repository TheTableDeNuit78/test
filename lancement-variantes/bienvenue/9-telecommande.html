<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienvenue · Télécommande</title>
<link rel="stylesheet" href="../commun.css">
<style>
/*
 * Variante 9 — « La télécommande ».
 * Un objet plutôt qu'une image : une télécommande Aurora, dessinée en CSS, posée de biais à
 * droite. Ses quatre touches de couleur portent les quatre actions de l'écran ; la légende à
 * gauche les reprend (ce sont les vrais boutons, accessibles au clavier). Survoler l'un allume
 * l'autre ; appuyer fait clignoter la diode infrarouge. On peut aussi taper 1, 2, 3, 4.
 */
.page {
  position: fixed; inset: 0;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr); align-items: center;
  padding: 0 var(--gouttiere);
}
.colonne { max-width: 620px; }
.colonne .marque { margin-bottom: clamp(28px, 4.5vh, 52px); }
.legende { display: grid; gap: 4px; margin: 30px 0 0; padding: 0; list-style: none; max-width: 540px; }
.legende li { display: grid; }
.touche {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 14px;
  padding: 12px 14px; border: 0; border-radius: 14px; background: transparent; text-align: left; cursor: pointer;
  transition: background-color 150ms var(--ease);
}
.touche:hover, .touche.allume { background: var(--bg-elev); }
.touche .pastille { width: 34px; height: 16px; border-radius: 8px; background: var(--k); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.25), 0 0 0 0 var(--k); transition: box-shadow 200ms; }
.touche:hover .pastille, .touche.allume .pastille { box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.25), 0 0 18px 0 color-mix(in srgb, var(--k) 70%, transparent); }
.touche b { font-size: 16px; font-weight: 600; }
.touche small { display: block; margin-top: 2px; font-size: 12.5px; line-height: 1.45; color: var(--text-dim); }
.touche kbd { font: 600 12px/1 var(--mono); color: var(--text-faint); padding: 4px 7px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--border-strong); }
.touche[aria-pressed="true"] b::after { content: ' · activé'; color: var(--ok); font-weight: 500; }

/* ───────── La télécommande ───────── */
.objet { position: relative; display: grid; place-items: center; height: 100vh; }
.ombre { position: absolute; bottom: 7vh; width: 240px; height: 40px; border-radius: 50%; background: rgba(0, 0, 0, 0.55); filter: blur(18px); transform: rotate(16deg) translateX(40px); }
.tele {
  position: relative;
  width: 230px; height: 760px;
  padding: 34px 26px 30px;
  display: flex; flex-direction: column; align-items: center; gap: 22px;
  border-radius: 115px 115px 96px 96px / 70px 70px 56px 56px;
  background:
    linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 22%, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, 0.35) 100%),
    linear-gradient(180deg, #2a2a33, #1b1b22 40%, #17171d);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 -3px 0 rgba(0, 0, 0, 0.55), inset 2px 0 0 rgba(255, 255, 255, 0.05), 0 40px 70px rgba(0, 0, 0, 0.55);
  transform: rotate(16deg);
  animation: pose 900ms var(--ease-back) 200ms backwards;
}
@keyframes pose { from { opacity: 0; transform: rotate(28deg) translateY(60px) scale(0.92); } }
.haut { display: flex; justify-content: space-between; align-items: center; width: 100%; }
.ir { width: 54px; height: 18px; border-radius: 9px; background: linear-gradient(180deg, #3a1218, #120507); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.7); }
.ir.flash { background: radial-gradient(circle, #ff8b8b, #b3121f 60%, #3a1218); box-shadow: 0 0 22px rgba(255, 70, 70, 0.8); }
.btn { display: grid; place-items: center; border: 0; padding: 0; color: #c8c8d4; cursor: pointer; background: linear-gradient(180deg, #34343f, #26262e); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 2px 0 #0d0d11, 0 3px 6px rgba(0, 0, 0, 0.4); transition: transform 80ms, box-shadow 80ms; }
.btn:active, .btn.appui { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 0 0 #0d0d11, 0 1px 2px rgba(0, 0, 0, 0.4); }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.marche { width: 40px; height: 40px; border-radius: 50%; color: #ff5d67; }
.nomTele { font-size: 10px; font-weight: 700; letter-spacing: 0.4em; color: #6d6d7c; margin: -8px 0 -6px; padding-left: 0.4em; }
.pad { position: relative; width: 168px; height: 168px; border-radius: 50%; background: linear-gradient(180deg, #30303a, #22222a); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 3px 0 #0d0d11, 0 6px 12px rgba(0, 0, 0, 0.45); }
.pad .fl { position: absolute; width: 14px; height: 14px; border: solid #8c8c9b; border-width: 2px 2px 0 0; }
.pad .n { left: 77px; top: 20px; transform: rotate(-45deg); } .pad .s { left: 77px; bottom: 20px; transform: rotate(135deg); }
.pad .o { left: 20px; top: 77px; transform: rotate(-135deg); } .pad .e { right: 20px; top: 77px; transform: rotate(45deg); }
.ok { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; }
.rangee { display: flex; gap: 16px; }
.rond { width: 44px; height: 44px; border-radius: 50%; }
.rond .lambda { width: 18px; height: 18px; }
.chiffres { display: grid; grid-template-columns: repeat(3, 46px); gap: 10px 14px; }
.chiffres .btn { height: 30px; border-radius: 10px; font-size: 14px; font-weight: 600; }
.couleurs { display: grid; grid-template-columns: repeat(4, 34px); gap: 10px; }
.couleurs .btn { height: 18px; border-radius: 9px; background: linear-gradient(180deg, color-mix(in srgb, var(--k) 100%, #fff 12%), color-mix(in srgb, var(--k) 80%, #000)); }
.couleurs .btn.allume { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 2px 0 #0d0d11, 0 0 16px color-mix(in srgb, var(--k) 80%, transparent); }
.etiq { display: grid; grid-template-columns: repeat(4, 34px); gap: 10px; margin-top: -16px; font-size: 7.5px; font-weight: 700; letter-spacing: 0.04em; color: #6d6d7c; text-align: center; text-transform: uppercase; }
.bas { margin-top: auto; display: grid; justify-items: center; gap: 8px; }
.bas .lambda { width: 26px; height: 26px; opacity: 0.85; }
.bas span { font-size: 7px; letter-spacing: 0.24em; color: #55555f; padding-left: 0.3em; }

@media (max-height: 860px) { .tele { zoom: 0.86; } }
@media (max-height: 740px) { .tele { zoom: 0.72; } }
@media (max-width: 1000px) { .page { grid-template-columns: 1fr; overflow: auto; } .objet { display: none; } }
</style>
</head>
<body>
<main class="page">
  <section class="colonne entre">
    <span class="marque"><span class="lambda"></span>Aurora</span>
    <h1 class="titre">Ton abonnement,<br>enfin rangé.</h1>
    <p class="phrase">Guide TV, téléchargements, enregistrements, favoris. Tes identifiants sont chiffrés sur ce PC, et rien ne part ailleurs.</p>
    <ul class="legende">
      <li><button class="touche" type="button" data-k="0" style="--k:#e5333f"><span class="pastille"></span><span><b>Compte Xtream</b><small>serveur, identifiant, mot de passe</small></span><kbd>1</kbd></button></li>
      <li><button class="touche" type="button" data-k="1" style="--k:#27b05a"><span class="pastille"></span><span><b>Playlist M3U</b><small>une adresse, ou un fichier .m3u</small></span><kbd>2</kbd></button></li>
      <li><button class="touche" type="button" data-k="2" style="--k:#f2c230" aria-pressed="false" id="fr"><span class="pastille"></span><span><b>N’afficher que le français</b><small>cache ce qui porte « EN&nbsp;- », « AR&nbsp;- »… Ce qui n’a aucune étiquette reste. Réglages&nbsp;▸&nbsp;Catalogue pour défaire.</small></span><kbd>3</kbd></button></li>
      <li><button class="touche" type="button" data-k="3" style="--k:#2f7de1"><span class="pastille"></span><span><b>Reprendre une sauvegarde</b><small>le fichier .aurora rend comptes, réglages, favoris, historique</small></span><kbd>4</kbd></button></li>
    </ul>
  </section>

  <div class="objet" aria-hidden="true">
    <span class="ombre"></span>
    <div class="tele" id="tele">
      <div class="haut"><span class="ir" id="ir"></span><span class="btn marche"><svg viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg></span></div>
      <span class="nomTele">AURORA</span>
      <div class="pad"><span class="fl n"></span><span class="fl s"></span><span class="fl o"></span><span class="fl e"></span><span class="btn ok">OK</span></div>
      <div class="rangee">
        <span class="btn rond"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span>
        <span class="btn rond"><span class="lambda"></span></span>
        <span class="btn rond"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>
      </div>
      <div class="chiffres" id="chiffres"></div>
      <div class="couleurs" id="couleurs"></div>
      <div class="etiq"><span>Xtream</span><span>M3U</span><span>FR</span><span>Sauv.</span></div>
      <div class="bas"><span class="lambda"></span><span>CHAÎNES · FILMS · SÉRIES</span></div>
    </div>
  </div>
</main>

<span class="etiquette">Variante 9 · La télécommande — tape 1, 2, 3 ou 4</span>

<script src="../commun.js"></script>
<script>
'use strict';
(() => {
  const $ = (id) => document.getElementById(id);
  const COUL = ['#e5333f', '#27b05a', '#f2c230', '#2f7de1'];
  $('chiffres').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'TXT', '0', 'EPG'].map((c) => `<span class="btn" style="${c.length > 1 ? 'font-size:10px;letter-spacing:.06em' : ''}">${c}</span>`).join('');
  $('couleurs').innerHTML = COUL.map((k, i) => `<span class="btn" data-k="${i}" style="--k:${k}"></span>`).join('');
  const touches = [...document.querySelectorAll('.touche')];
  const couleurs = [...$('couleurs').children];
  const chiffres = [...$('chiffres').children];

  const allumer = (i, oui) => { touches[i].classList.toggle('allume', oui); couleurs[i].classList.toggle('allume', oui); };
  function appuyer(i) {
    couleurs[i].classList.add('appui'); chiffres[i].classList.add('appui');
    $('ir').classList.add('flash');
    setTimeout(() => { couleurs[i].classList.remove('appui'); chiffres[i].classList.remove('appui'); $('ir').classList.remove('flash'); }, 180);
    if (i === 2) $('fr').setAttribute('aria-pressed', String($('fr').getAttribute('aria-pressed') !== 'true'));
  }
  touches.forEach((t, i) => {
    t.addEventListener('mouseenter', () => allumer(i, true));
    t.addEventListener('mouseleave', () => allumer(i, false));
    t.addEventListener('focus', () => allumer(i, true));
    t.addEventListener('blur', () => allumer(i, false));
    t.addEventListener('click', () => appuyer(i));
  });
  addEventListener('keydown', (e) => { const i = '1234'.indexOf(e.key); if (i >= 0) { appuyer(i); allumer(i, true); setTimeout(() => allumer(i, false), 400); } });
})();
</script>
</body>
</html>
