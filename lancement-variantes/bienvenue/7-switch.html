<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienvenue · d’après Nintendo Switch</title>
<link rel="stylesheet" href="../commun.css">
<link rel="stylesheet" href="../polices.css">
<style>
/*
 * Variante 7 — d'après le menu HOME de la Nintendo Switch.
 * Fond gris clair, grandes tuiles blanches carrées, le nom de la tuile choisie au-dessus d'elle,
 * le cadre turquoise qui pulse autour de la sélection, une rangée de boutons ronds dessous, et la
 * barre des touches en bas. Tout se pilote aux flèches et à Entrée, comme à la manette ; un petit
 * rebond confirme chaque choix.
 */
:root { color-scheme: light; --s: 'Nunito Sans', 'Segoe UI', sans-serif; --fond: #ebebeb; --t1: #2d2d2d; --t2: #7a7a7a; --cyan: #00c3e3; }
body { background: var(--fond); color: var(--t1); font: 15px/1.4 var(--s); }
.page { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; }
.haut { display: flex; align-items: center; justify-content: space-between; padding: 26px 56px 0; }
.joueur { display: flex; align-items: center; gap: 12px; font-weight: 700; }
.joueur .av { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: #111; box-shadow: 0 0 0 3px #fff; }
.joueur .av .lambda { width: 26px; height: 26px; }
.etat { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 18px; }
.etat svg { width: 24px; height: 24px; fill: none; stroke: var(--t1); stroke-width: 2; }
.milieu { align-self: center; padding: 0 56px; }
.titre-s { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.01em; }
.sous-s { margin: 6px 0 0; color: var(--t2); font-size: 16px; }
.rangee { position: relative; display: flex; gap: 22px; margin-top: 56px; }
.tuile { all: unset; position: relative; display: grid; place-items: center; width: 232px; aspect-ratio: 1; border-radius: 4px; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08); cursor: pointer; transition: transform 160ms cubic-bezier(.3, 1.6, .6, 1); }
.tuile svg { width: 92px; height: 92px; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tuile .nom { position: absolute; left: 50%; bottom: calc(100% + 14px); transform: translateX(-50%); white-space: nowrap; font-size: 18px; font-weight: 700; color: #1e8fe0; opacity: 0; }
.tuile.focus .nom { opacity: 1; }
.tuile.focus::after { content: ''; position: absolute; inset: -9px; border-radius: 8px; border: 5px solid var(--cyan); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { border-color: #00c3e3; box-shadow: 0 0 0 0 rgba(0, 195, 227, 0.0); } 50% { border-color: #5ff2ff; box-shadow: 0 0 14px 2px rgba(0, 195, 227, 0.35); } }
.tuile.boing { animation: boing 260ms cubic-bezier(.3, 1.6, .6, 1); }
@keyframes boing { 40% { transform: scale(0.94); } }
.ronds { display: flex; justify-content: center; gap: 34px; margin-top: 46px; }
.rond { all: unset; position: relative; display: grid; place-items: center; width: 72px; height: 72px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08); cursor: pointer; }
.rond svg { width: 30px; height: 30px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rond.focus::after { content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 5px solid var(--cyan); animation: pulse 1.1s ease-in-out infinite; }
.rond .marque-on { position: absolute; right: -2px; top: -2px; width: 18px; height: 18px; border-radius: 50%; background: #2fc25b; border: 3px solid var(--fond); display: none; }
.rond[aria-checked="true"] .marque-on { display: block; }
.legende { margin: 22px auto 0; text-align: center; max-width: 64ch; min-height: 3em; color: var(--t2); font-size: 14px; }
.legende b { color: var(--t1); }
.bas { display: flex; align-items: center; justify-content: space-between; margin: 0 56px; padding: 18px 0 24px; border-top: 1px solid #c9c9c9; font-weight: 700; }
.touches { display: flex; gap: 28px; }
.touches span { display: inline-flex; align-items: center; gap: 8px; }
.touches i { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--t1); color: #fff; font-style: normal; font-size: 13px; font-weight: 800; }
.bas .reprise { font-weight: 600; font-size: 14px; color: var(--t2); }
.etiquette { background: rgba(255, 255, 255, 0.85); color: #7a7a7a; border-color: #d0d0d0; }
</style>
</head>
<body>
<main class="page">
  <header class="haut">
    <span class="joueur"><span class="av"><span class="lambda"></span></span>Aurora</span>
    <span class="etat"><span id="heure">21:34</span><svg viewBox="0 0 24 24"><path d="M2 9a16 16 0 0 1 20 0M5 12.5a11 11 0 0 1 14 0M8.5 16a6 6 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="#2d2d2d"/></svg><svg viewBox="0 0 30 24"><rect x="2" y="6" width="22" height="12" rx="2"/><rect x="5" y="9" width="16" height="6" fill="#2d2d2d" stroke="none"/><path d="M26 10v4"/></svg></span>
  </header>
  <section class="milieu">
    <h1 class="titre-s">Ton abonnement, enfin rangé.</h1>
    <p class="sous-s">Choisis ce que ton fournisseur t’a donné. Tes identifiants restent chiffrés sur ce PC.</p>
    <div class="rangee" id="rangee">
      <button class="tuile" type="button"><span class="nom">Compte Xtream</span><svg viewBox="0 0 24 24" stroke="#1e8fe0"><rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01M6 18h.01"/></svg></button>
      <button class="tuile" type="button"><span class="nom">Playlist M3U</span><svg viewBox="0 0 24 24" stroke="#e6005c"><path d="M21 5H3M11 12H3M11 19H3M15 12v7l6-3.5z"/></svg></button>
      <button class="tuile" type="button"><span class="nom">Fichier .m3u sur ce PC</span><svg viewBox="0 0 24 24" stroke="#f08a00"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg></button>
      <button class="tuile" type="button"><span class="nom">Reprendre une sauvegarde</span><svg viewBox="0 0 24 24" stroke="#26a65b"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>
    <div class="ronds" id="ronds">
      <button class="rond" type="button" role="switch" aria-checked="false" id="fr" data-l="<b>Français uniquement</b> — cache ce qui porte une autre langue (« EN - », « AR - »). Ce qui n’a aucune étiquette reste. Réglages ▸ Catalogue pour défaire."><span class="marque-on"></span><svg viewBox="0 0 24 24" stroke="#5a49e0"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></svg></button>
      <button class="rond" type="button" data-l="<b>Confidentialité</b> — tes identifiants sont chiffrés sur ce PC, et rien ne part ailleurs."><svg viewBox="0 0 24 24" stroke="#2d2d2d"><rect width="16" height="10" x="4" y="11" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      <button class="rond" type="button" data-l="<b>Aide</b> — où trouver ton serveur, ton identifiant et ton mot de passe."><svg viewBox="0 0 24 24" stroke="#2d2d2d"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg></button>
    </div>
    <p class="legende" id="legende"></p>
  </section>
  <footer class="bas">
    <span class="reprise">Le fichier .aurora rend tes comptes, tes réglages, tes favoris et ton historique.</span>
    <span class="touches"><span><i>A</i>OK</span><span><i>B</i>Retour</span><span><i>+</i>Options</span></span>
  </footer>
</main>
<span class="etiquette" style="bottom:auto;top:96px">Variante 7 · d’après Nintendo Switch — flèches et Entrée</span>
<script>
'use strict';
(() => {
  const tuiles = [...document.querySelectorAll('.tuile')], ronds = [...document.querySelectorAll('.rond')];
  const grille = [tuiles, ronds];
  let ligne = 0, col = 0;
  const leg = document.getElementById('legende');
  function focus() {
    [...tuiles, ...ronds].forEach((e) => e.classList.remove('focus'));
    const el = grille[ligne][col]; el.classList.add('focus'); el.focus({ preventScroll: true });
    leg.innerHTML = ligne === 1 ? el.dataset.l : 'Le choix se confirme avec <b>A</b> (Entrée). Les ronds en dessous : la langue, la confidentialité, l’aide.';
  }
  function choisir() {
    const el = grille[ligne][col];
    el.classList.remove('boing'); void el.offsetWidth; el.classList.add('boing');
    if (el.id === 'fr') el.setAttribute('aria-checked', String(el.getAttribute('aria-checked') !== 'true'));
  }
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') col = Math.min(grille[ligne].length - 1, col + 1);
    else if (e.key === 'ArrowLeft') col = Math.max(0, col - 1);
    else if (e.key === 'ArrowDown') { ligne = 1; col = Math.min(col, ronds.length - 1); }
    else if (e.key === 'ArrowUp') ligne = 0;
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choisir(); return; }
    else return;
    e.preventDefault(); focus();
  });
  grille.forEach((g, l) => g.forEach((el, c) => {
    el.addEventListener('mouseenter', () => { ligne = l; col = c; focus(); });
    el.addEventListener('click', () => { ligne = l; col = c; focus(); choisir(); });
  }));
  focus();
})();
</script>
</body>
</html>
