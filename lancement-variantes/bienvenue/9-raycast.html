<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienvenue · d’après Raycast</title>
<link rel="stylesheet" href="../commun.css">
<link rel="stylesheet" href="../polices.css">
<style>
/*
 * Variante 9 — d'après Raycast.
 * Le premier lancement est une barre de commandes : on tape ce qu'on veut faire, la liste se
 * filtre, les flèches choisissent, Entrée lance. Sections, icônes en carrés colorés, raccourcis à
 * droite, interrupteur en ligne pour le français, et la barre d'actions en bas de la fenêtre.
 * Pour qui préfère le clavier à la souris.
 */
:root { --r: 'Inter', -apple-system, 'Segoe UI', sans-serif; --t1: #ededef; --t2: #9a9aa2; --t3: #6c6c74; }
body { background: #0b0b0d; color: var(--t1); font: 14px/1.4 var(--r); }
.fond { position: fixed; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px); background-size: 48px 48px; }
.fond::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, transparent, #ff6363 30%, #9d5cff 70%, transparent); opacity: 0.8; }
.centre { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 22px; }
.accroche { display: grid; justify-items: center; gap: 6px; text-align: center; }
.accroche h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.025em; }
.accroche p { margin: 0; color: var(--t2); font-size: 14.5px; }
.fen { width: min(780px, 92vw); border-radius: 14px; background: rgba(30, 30, 33, 0.96); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.09), 0 50px 120px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 0, 0, 0.6); overflow: hidden; }
.recherche { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
.recherche .lambda { width: 20px; height: 20px; }
.recherche input { flex: 1; border: 0; background: transparent; color: var(--t1); font: 18px var(--r); outline: none; caret-color: #ff6363; }
.recherche input::placeholder { color: var(--t3); }
.recherche kbd { font: 500 12px var(--r); color: var(--t2); padding: 3px 7px; border-radius: 6px; background: rgba(255, 255, 255, 0.06); }
.liste { max-height: 430px; overflow: auto; padding: 8px; }
.sec { padding: 10px 10px 6px; font-size: 12px; font-weight: 600; color: var(--t3); }
.it { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 9px; cursor: pointer; }
.it.sel { background: rgba(255, 255, 255, 0.08); }
.it .ic { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; color: #fff; background: var(--c); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25); }
.it .ic svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.it b { font-weight: 500; }
.it span span { margin-left: 8px; color: var(--t2); }
.it .acc { font-size: 12.5px; color: var(--t3); }
.it .acc kbd { font: 500 12px var(--r); color: var(--t2); padding: 2px 6px; border-radius: 5px; background: rgba(255, 255, 255, 0.06); margin-left: 3px; }
.it .bas2 { display: inline-flex; align-items: center; gap: 8px; }
.mini { position: relative; width: 30px; height: 18px; border-radius: 9px; background: #3a3a40; }
.mini::after { content: ''; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform 180ms; }
.on .mini { background: #30d158; }
.on .mini::after { transform: translateX(12px); }
.explique { margin: -2px 10px 6px 48px; font-size: 12.5px; color: var(--t3); }
.actions { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-top: 1px solid rgba(255, 255, 255, 0.07); background: rgba(255, 255, 255, 0.02); font-size: 12.5px; color: var(--t2); }
.actions .g { display: inline-flex; align-items: center; gap: 8px; }
.actions .g .lambda { width: 14px; height: 14px; }
.actions .d { display: inline-flex; align-items: center; gap: 14px; }
.actions b { color: var(--t1); font-weight: 500; }
.actions kbd { font: 500 12px var(--r); color: var(--t2); padding: 2px 6px; border-radius: 5px; background: rgba(255, 255, 255, 0.07); margin-left: 4px; }
.toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: #2a2a2e; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1); font-size: 13.5px; opacity: 0; transition: opacity 200ms; }
.toast.vu { opacity: 1; }
.etiquette { background: #121214; color: #6c6c74; border-color: #26262a; }
</style>
</head>
<body>
<div class="fond" aria-hidden="true"></div>
<main class="centre">
  <div class="accroche"><h1>Ton abonnement, enfin rangé.</h1><p>Tape ce que tu veux faire. Tes identifiants restent chiffrés sur ce PC.</p></div>
  <section class="fen" role="dialog" aria-label="Aurora — premier lancement">
    <div class="recherche"><span class="lambda"></span><input id="q" placeholder="Ajouter ton abonnement…" aria-label="Rechercher une action" autocomplete="off"><kbd>Échap</kbd></div>
    <div class="liste" id="liste" role="listbox"></div>
    <div class="actions"><span class="g"><span class="lambda"></span>Aurora · premier lancement</span><span class="d"><span><b id="act">Ouvrir</b><kbd>↵</kbd></span><span>Actions<kbd>Ctrl</kbd><kbd>K</kbd></span></span></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>
<span class="etiquette">Variante 9 · d’après Raycast — tape, ↑ ↓, Entrée</span>
<script>
'use strict';
(() => {
  const ICO = {
    coller: '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="8" y="2" rx="1"/>',
    serveur: '<rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/>',
    liste: '<path d="M21 5H3M11 12H3M11 19H3M15 12v7l6-3.5z"/>',
    fichier: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
    langue: '<path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/>',
    reprise: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
    aide: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/>',
  };
  const ITEMS = [
    ['Suggestion', 'coller', 'linear-gradient(135deg,#ff6363,#c3315b)', 'Coller le lien de ton fournisseur', 'get.php, .m3u, ou le mail entier', '<kbd>Ctrl</kbd><kbd>V</kbd>'],
    ['Ajouter', 'serveur', 'linear-gradient(135deg,#5ea2ff,#2f62e0)', 'Ajouter un compte Xtream', 'serveur, identifiant, mot de passe', 'Commande'],
    ['Ajouter', 'liste', 'linear-gradient(135deg,#ff82c4,#d0368a)', 'Importer une playlist M3U', 'une adresse en http', 'Commande'],
    ['Ajouter', 'fichier', 'linear-gradient(135deg,#ffb35c,#e07a14)', 'Ouvrir un fichier .m3u', 'déjà sur ce PC', '<kbd>Ctrl</kbd><kbd>O</kbd>'],
    ['Préférences', 'langue', 'linear-gradient(135deg,#a98bff,#6a4cff)', 'N’afficher que le français', 'langue du catalogue', 'interrupteur', 'Cache ce qui porte une autre langue (« EN - », « AR - »). Ce qui n’a aucune étiquette reste. Réglages ▸ Catalogue pour défaire.'],
    ['Autre', 'reprise', 'linear-gradient(135deg,#4fd1a5,#1b9a6e)', 'Restaurer une sauvegarde .aurora', 'comptes, réglages, favoris, historique', 'Commande'],
    ['Autre', 'aide', 'linear-gradient(135deg,#9aa0ad,#5d6370)', 'Où trouver mes identifiants ?', 'dans le mail de ton fournisseur', 'Aide'],
  ];
  let sel = 1, fr = false, visibles = [];
  const liste = document.getElementById('liste');
  function rendre() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    visibles = ITEMS.map((it, i) => ({ it, i })).filter(({ it }) => !q || `${it[3]} ${it[4]}`.toLowerCase().includes(q));
    if (!visibles.some((v) => v.i === sel)) sel = visibles[0]?.i ?? -1;
    let html = '', sec = '';
    for (const { it, i } of visibles) {
      if (it[0] !== sec) { sec = it[0]; html += `<div class="sec">${sec}</div>`; }
      const acc = it[5] === 'interrupteur' ? `<span class="bas2">${fr ? 'Activé' : 'Désactivé'}<span class="mini"></span></span>` : it[5];
      html += `<div class="it${i === sel ? ' sel' : ''}${it[5] === 'interrupteur' && fr ? ' on' : ''}" role="option" aria-selected="${i === sel}" data-i="${i}"><span class="ic" style="--c:${it[2]}"><svg viewBox="0 0 24 24">${ICO[it[1]]}</svg></span><span><b>${it[3]}</b><span>${it[4]}</span></span><span class="acc">${acc}</span></div>`;
      if (it[6]) html += `<div class="explique">${it[6]}</div>`;
    }
    liste.innerHTML = html || '<div class="sec">Aucune action. Essaie « xtream », « m3u » ou « sauvegarde ».</div>';
    liste.querySelectorAll('.it').forEach((d) => { d.addEventListener('mousemove', () => { if (sel !== +d.dataset.i) { sel = +d.dataset.i; rendre(); } }); d.addEventListener('click', lancer); });
    document.getElementById('act').textContent = ITEMS[sel]?.[5] === 'interrupteur' ? 'Basculer' : 'Ouvrir';
  }
  function lancer() {
    const it = ITEMS[sel]; if (!it) return;
    if (it[5] === 'interrupteur') { fr = !fr; rendre(); return; }
    const t = document.getElementById('toast'); t.textContent = `${it[3]}…`; t.classList.add('vu'); setTimeout(() => t.classList.remove('vu'), 1400);
  }
  document.getElementById('q').addEventListener('input', rendre);
  addEventListener('keydown', (e) => {
    const ids = visibles.map((v) => v.i), p = ids.indexOf(sel);
    if (e.key === 'ArrowDown') { sel = ids[Math.min(ids.length - 1, p + 1)]; rendre(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = ids[Math.max(0, p - 1)]; rendre(); e.preventDefault(); }
    else if (e.key === 'Enter') { lancer(); e.preventDefault(); }
  });
  rendre();
  document.getElementById('q').focus();
})();
</script>
</body>
</html>
