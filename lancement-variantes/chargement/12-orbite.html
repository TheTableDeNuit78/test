<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chargement · Orbite</title>
<link rel="stylesheet" href="../commun.css">
<link rel="stylesheet" href="../polices.css">
<style>
/*
 * Variante 12 — « L'orbite ».
 * Un planétaire : le Λ au centre, cinq orbites inclinées autour, une par étape. Chaque planète
 * fait un tour complet pendant son étape et laisse derrière elle sa trace (bleue pendant le
 * tour, verte une fois bouclée). Les orbites des étapes à venir restent en pointillé. Des
 * repères d'angle en petites capitales donnent le côté « instrument ».
 */
.ecran { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(300px, 0.55fr) minmax(0, 1.45fr); align-items: center; padding: 0 0 0 var(--gouttiere); }
.gauche { position: relative; z-index: 2; max-width: 420px; }
.gauche .marque { margin-bottom: 40px; }
.pct { font-size: clamp(72px, 8vw, 140px); font-weight: 700; line-height: 0.88; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
.pct small { font-size: 0.36em; color: var(--text-dim); margin-left: 6px; letter-spacing: 0; }
.etat { margin: 14px 0 0; font-size: 15px; color: var(--text-dim); }
.etat b { color: var(--text); font-weight: 600; }
.etat em { font-style: normal; color: var(--etat-cours); font-variant-numeric: tabular-nums; }
.gauche .go { margin-top: 32px; }
.avis { margin: 14px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--text-faint); max-width: 44ch; }
.avis strong { color: var(--text-dim); }
.pret .gauche .go { background: #f4f4f6; color: #0e0e12; border-color: transparent; font-weight: 600; }
#ciel { width: 100%; height: 100vh; display: block; overflow: visible; }
.orbite { fill: none; stroke: rgba(238, 238, 242, 0.22); stroke-width: 1; stroke-dasharray: 2 6; }
.fait .orbite, .encours .orbite { stroke-dasharray: none; }
.trace { fill: none; stroke-width: 2.4; stroke-linecap: round; }
.fait .trace { stroke: var(--ok); }
.encours .trace { stroke: var(--etat-cours); }
.planete { stroke: var(--bg); stroke-width: 3; }
.attente .planete { fill: #3a3a47 !important; }
.lib { font: 600 13px var(--font); fill: var(--text); }
.lib2 { font: 500 12px var(--font); fill: var(--text-dim); font-variant-numeric: tabular-nums; }
.attente .lib { fill: var(--text-faint); }
.fait .lib2 { fill: var(--ok); }
.encours .lib2 { fill: var(--etat-cours); }
.graduation { font: 500 10px var(--mono-jb); fill: rgba(238, 238, 242, 0.28); letter-spacing: 0.08em; }
</style>
</head>
<body>
<main class="ecran">
  <section class="gauche">
    <span class="marque"><span class="lambda"></span>Aurora</span>
    <div class="pct" id="pct" role="progressbar" aria-label="Chargement du catalogue" aria-valuemin="0" aria-valuemax="100">0<small>%</small></div>
    <p class="etat" id="etat">Le catalogue est chargé en entier, pour que rien ne rame ensuite.</p>
    <button class="go fantome" type="button" id="continuer">Continuer sans attendre</button>
    <p class="avis" id="avis">L’app s’ouvrira tout de suite, mais elle <strong>peut ramer</strong> le temps que le reste arrive : chaque écran chargera ce qui lui manque à son ouverture.</p>
  </section>
  <svg id="ciel" aria-hidden="true"></svg>
</main>
<span class="etiquette">Chargement · Variante 12 · L’orbite</span>

<script src="../commun.js"></script>
<script>
'use strict';
(() => {
  const { ETAPES, chargement, fmt, hasard } = Aurora;
  const $ = (id) => document.getElementById(id);
  const svg = $('ciel');
  const TEINTES = ['#f5a524', '#f57ab8', '#b18cff', '#4ea8f5', '#2fd0c8'];
  const NOMS = ['Catégories', 'Films', 'Séries', 'Chaînes', 'Guide'];
  let G;

  // L'orbite complète en deux demi-arcs, dans le sens des aiguilles d'une montre, depuis l'angle de départ.
  function arc(cx, cy, o) {
    const pt = (a) => `${(cx + o.rx * Math.cos(a)).toFixed(2)} ${(cy + o.ry * Math.sin(a)).toFixed(2)}`;
    return `M ${pt(o.a0)} A ${o.rx} ${o.ry} 0 0 1 ${pt(o.a0 + Math.PI)} A ${o.rx} ${o.ry} 0 0 1 ${pt(o.a0 + 2 * Math.PI - 0.0001)}`;
  }
  function construire() {
    const r = svg.getBoundingClientRect();
    const W = r.width, H = r.height, cx = W * 0.47, cy = H * 0.5;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const base = Math.min(W * 0.46, H * 1.05);
    // Chaque planète part d'un angle différent : une fois leur tour bouclé, elles restent réparties.
    const orbites = ETAPES.map((_, i) => { const rx = base * (0.3 + i * 0.165); return { rx, ry: rx * 0.42, a0: -Math.PI / 2 + i * 1.3 }; });
    const alea = hasard(21);
    const etoiles = Array.from({ length: 140 }, () => `<circle cx="${(alea() * W).toFixed(1)}" cy="${(alea() * H).toFixed(1)}" r="${(0.3 + alea() * 0.9).toFixed(2)}" fill="#eef0ff" opacity="${(0.15 + alea() * 0.5).toFixed(2)}"/>`).join('');
    // Graduations d'angle sur l'orbite extérieure, tous les 30°.
    const ext = orbites[4];
    let grad = '';
    for (let a = 0; a < 360; a += 30) {
      const t = (a - 90) * Math.PI / 180;
      const x = cx + (ext.rx + 22) * Math.cos(t), y = cy + (ext.ry + 14) * Math.sin(t);
      grad += `<text class="graduation" x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="middle">${String(a).padStart(3, '0')}°</text>`;
    }
    const lh = Math.min(64, base * 0.16), lw = lh * 28 / 31;
    svg.innerHTML = `
      <defs><linearGradient id="prisme" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4ea8f5"/><stop offset=".5" stop-color="#9d5cff"/><stop offset="1" stop-color="#ff6cab"/></linearGradient></defs>
      ${etoiles}${grad}
      ${orbites.map((o, i) => `<g id="o${i}" class="attente">
        <ellipse class="orbite" cx="${cx}" cy="${cy}" rx="${o.rx}" ry="${o.ry}"/>
        <path class="trace" id="t${i}" pathLength="1" stroke-dasharray="0 1" d="${arc(cx, cy, o)}"/>
        <circle class="planete" id="p${i}" r="${7 + i * 0.6}" fill="${TEINTES[i]}"/>
        <text class="lib" id="l${i}">${NOMS[i]}</text><text class="lib2" id="m${i}"></text>
      </g>`).join('')}
      <path d="M${cx - lw / 2} ${cy + lh / 2}L${cx} ${cy - lh / 2}l${lw / 2} ${lh}" fill="none" stroke="url(#prisme)" stroke-width="${lh * 5 / 31}" stroke-linecap="round" stroke-linejoin="round"/>`;
    G = { cx, cy, orbites };
  }

  construire();
  addEventListener('resize', construire);
  chargement({
    rendu(etat) {
      etat.etapes.forEach((e, i) => {
        const o = G.orbites[i];
        $(`o${i}`).setAttribute('class', e.etat);
        $(`t${i}`).setAttribute('stroke-dasharray', `${e.k.toFixed(4)} 1`);
        // La planète part de son angle et tourne dans le sens des aiguilles d'une montre.
        const t = o.a0 + e.k * Math.PI * 2;
        const x = G.cx + o.rx * Math.cos(t), y = G.cy + o.ry * Math.sin(t);
        const p = $(`p${i}`); p.setAttribute('cx', x.toFixed(1)); p.setAttribute('cy', y.toFixed(1));
        const droite = Math.cos(t) >= -0.2;
        for (const [id, dy] of [[`l${i}`, -2], [`m${i}`, 13]]) {
          const el = $(id);
          el.setAttribute('x', (x + (droite ? 16 : -16)).toFixed(1)); el.setAttribute('y', (y + dy).toFixed(1));
          el.setAttribute('text-anchor', droite ? 'start' : 'end');
        }
        $(`m${i}`).textContent = e.etat === 'attente' ? 'en attente' : `${fmt(e.n)} ${e.unite[1]}${e.etat === 'encours' ? '…' : ''}`;
      });
      const pc = Math.round(etat.p * 100);
      $('pct').innerHTML = `${pc}<small>%</small>`;
      $('pct').setAttribute('aria-valuenow', pc);
      const c = etat.etapes[etat.courante];
      $('etat').innerHTML = etat.fini ? '<b>Tout est là.</b> Les écrans s’ouvriront d’un coup.'
        : etat.t < Aurora.ATTENTE ? 'On se connecte à ton serveur…' : `<b>${c.nom}</b> — <em>${fmt(c.n)}</em> sur ${fmt(c.cible)} · encore ${Math.max(1, Math.round(etat.reste))} s`;
      document.body.classList.toggle('pret', etat.fini);
      $('avis').hidden = etat.fini;
      $('continuer').textContent = etat.fini ? 'Ouvrir Aurora' : 'Continuer sans attendre';
    },
  });
})();
</script>
</body>
</html>
