<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chargement · Compteurs</title>
<link rel="stylesheet" href="../commun.css">
<style>
/*
 * Variante 3 — « Les cinq compteurs ».
 * Ce qui impressionne au premier lancement, ce sont les nombres : 99 123 films, 21 576 chaînes.
 * On leur donne tout l'écran. Cinq colonnes, une par étape, chacune avec son compteur en très
 * grand qui monte pendant que la liste arrive. Au-dessus, une seule ligne de progression court
 * d'un bord à l'autre et se découpe en cinq. La typographie fait le décor.
 */
.ecran {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: 38px var(--gouttiere) 40px;
}
.haut { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
.qui { display: grid; gap: 6px; }
.qui .compte { font-size: 13px; color: var(--text-faint); }
.qui .compte b { color: var(--text-dim); font-weight: 600; }
.tete { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; margin-bottom: 44px; }
.annonce { margin: 0; max-width: 17ch; font-size: clamp(30px, 3.3vw, 60px); font-weight: 700; line-height: 1.04; letter-spacing: -0.035em; text-wrap: balance; }
.total { text-align: right; flex: none; }
.total .pct { font-size: clamp(64px, 8.4vw, 160px); font-weight: 700; line-height: 0.9; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.total .pct small { font-size: 0.42em; color: var(--text-dim); margin-left: 4px; letter-spacing: 0; }
.total .reste { margin-top: 8px; font-size: 13px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

.milieu { align-self: center; padding-bottom: 10px; }
.ligne { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 34px; }
.seg { height: 4px; border-radius: 2px; background: rgba(238, 238, 242, 0.09); overflow: hidden; }
.seg i { display: block; height: 100%; background: var(--etat-cours); transform-origin: left; transform: scaleX(var(--k, 0)); }
.seg.fait i { background: var(--ok); }
.colonnes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.col { position: relative; display: grid; align-content: start; gap: 6px; min-width: 0; padding-right: 16px; }
.col .rang { font-size: 12.5px; font-weight: 600; color: var(--text-faint); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
.col .nom { font-size: 15px; font-weight: 600; color: var(--text-dim); }
.col .nombre {
  margin-top: 18px;
  font-size: clamp(38px, 4.5vw, 88px);
  font-weight: 700;
  line-height: 0.95;
  letter-spacing: -0.045em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--text-faint);
  transition: color 300ms;
}
.col .unite { font-size: 15px; color: var(--text-faint); }
.col .etat { display: inline-flex; align-items: center; gap: 7px; margin-top: 18px; font-size: 13px; color: var(--text-faint); }
.col .etat .ico { width: 15px; height: 15px; }
.col .dernier { min-height: 2.6em; margin-top: 6px; font-size: 12.5px; line-height: 1.3; color: var(--text-faint); overflow: hidden; }
.col .dernier b { display: block; color: var(--text-dim); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.col.encours .nom, .col.fait .nom { color: var(--text); }
.col.encours .nombre, .col.fait .nombre { color: var(--text); }
.col.encours .etat { color: var(--etat-cours); }
.col.encours .etat .ico { animation: tourne 0.9s linear infinite; }
.col.fait .etat { color: var(--ok); }
@keyframes tourne { to { transform: rotate(1turn); } }

.bas { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
.bas .ou { margin: 0; font-size: 13px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.bas .droite { display: flex; align-items: center; gap: 22px; }
.avis { margin: 0; max-width: 46ch; font-size: 12.5px; line-height: 1.55; color: var(--text-faint); text-align: right; }
.avis strong { color: var(--text-dim); }
.pret .bas .go { background: #f4f4f6; color: #0e0e12; border-color: transparent; font-weight: 600; }
</style>
</head>
<body>
<div class="ecran">
  <header class="haut">
    <div class="qui">
      <span class="marque"><span class="lambda"></span>Aurora</span>
      <span class="compte"><b>Mon abonnement</b> · fournisseur.example</span>
    </div>
  </header>

  <main class="milieu">
    <div class="tete">
      <h1 class="annonce" id="phrase">Le catalogue arrive en entier, pour que rien ne rame ensuite.</h1>
      <div class="total" role="progressbar" aria-label="Chargement du catalogue" aria-valuemin="0" aria-valuemax="100" id="total">
        <div class="pct" id="pct">0<small>%</small></div>
        <div class="reste" id="reste"></div>
      </div>
    </div>
    <div class="ligne" id="ligne"></div>
    <div class="colonnes" id="colonnes"></div>
  </main>

  <footer class="bas">
    <p class="ou" id="ou"></p>
    <div class="droite">
      <p class="avis" id="avis">L’app s’ouvrira tout de suite, mais elle <strong>peut ramer</strong> le temps que le reste arrive : chaque écran chargera ce qui lui manque à son ouverture.</p>
      <button class="go fantome" type="button" id="continuer">Continuer sans attendre</button>
    </div>
  </footer>
</div>

<span class="etiquette">Chargement · Variante 3 · Les cinq compteurs</span>

<script src="../commun.js"></script>
<script>
'use strict';
(() => {
  const { ETAPES, TITRES, CHAINES, CATEGORIES, chargement, fmt, pluriel, icone } = Aurora;
  const $ = (id) => document.getElementById(id);

  $('ligne').innerHTML = ETAPES.map(() => '<span class="seg"><i></i></span>').join('');
  $('colonnes').innerHTML = ETAPES.map((e, i) => `
    <div class="col" id="c${i}">
      <span class="rang">${String(i + 1).padStart(2, '0')}</span>
      <span class="nom">${e.nom}</span>
      <span class="nombre">—</span>
      <span class="unite">${e.unite[1]}</span>
      <span class="etat"></span>
      <span class="dernier"></span>
    </div>`).join('');
  const segs = [...$('ligne').children];
  const cols = ETAPES.map((_, i) => $(`c${i}`));

  // Le dernier élément arrivé, pour l'étape en cours : un nom réel plutôt qu'un chiffre de plus.
  const films = TITRES.filter((t) => t.genre === 'film').map((t) => t.titre);
  const series = TITRES.filter((t) => t.genre === 'serie').map((t) => t.titre);
  const progs = ['Le Comte de Monte-Cristo · 21:10', 'Quelle époque ! · 21:20', 'Ligue 1 — Lyon / Marseille · 21:00', 'Paris, Texas · 21:05', 'Zone interdite · 21:10', 'Quotidien · 19:25'];
  const SOURCES = [CATEGORIES.map((c) => c.nom), films, series, CHAINES.map((c) => c.nom), progs];

  chargement({
    rendu(etat) {
      const p = Math.round(etat.p * 100);
      $('pct').innerHTML = `${p}<small>%</small>`;
      $('total').setAttribute('aria-valuenow', p);
      $('reste').textContent = etat.fini ? `chargé en ${Math.round(Aurora.TOTAL + Aurora.ATTENTE)} s` : `encore ${Math.max(1, Math.round(etat.reste))} s environ`;
      etat.etapes.forEach((e, i) => {
        segs[i].className = `seg ${e.etat}`;
        segs[i].firstChild.style.setProperty('--k', e.k.toFixed(4));
        const c = cols[i];
        c.className = `col ${e.etat}`;
        c.children[2].textContent = e.etat === 'attente' ? '—' : fmt(e.n);
        c.children[3].textContent = pluriel(e.etat === 'attente' ? 2 : e.n, e.unite);
        c.children[4].innerHTML = e.etat === 'fait' ? `${icone('check')}terminé`
          : e.etat === 'encours' ? `${icone('loader')}en cours` : 'en attente';
        const src = SOURCES[i];
        c.children[5].innerHTML = e.etat === 'encours' && e.n > 0
          ? `dernier arrivé<b>${src[Math.floor(e.n / 7) % src.length]}</b>` : '';
      });
      document.body.classList.toggle('pret', etat.fini);
      $('phrase').textContent = etat.fini ? 'Tout est là. Les écrans s’ouvriront d’un coup.' : 'Le catalogue arrive en entier, pour que rien ne rame ensuite.';
      $('ou').textContent = `${etat.finies} ${etat.finies > 1 ? 'étapes' : 'étape'} sur 5`;
      $('avis').hidden = etat.fini;
      $('continuer').textContent = etat.fini ? 'Ouvrir Aurora' : 'Continuer sans attendre';
    },
  });
})();
</script>
</body>
</html>
