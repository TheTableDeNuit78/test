<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chargement · Ticket</title>
<link rel="stylesheet" href="../commun.css">
<link rel="stylesheet" href="../polices.css">
<style>
/*
 * Variante 11 — « Le ticket », en thème clair (la suite de la bienvenue 11).
 * Une imprimante thermique sort le relevé du catalogue, ligne par ligne : chaque étape s'imprime
 * avec son nombre quand elle est terminée, la ligne en cours compte sous la tête d'impression.
 * À la fin, le total, la durée, un code-barres, et le ticket se détache en dents de scie.
 */
:root { color-scheme: light; --fond: #e7e8ee; --encre: #15151c; --encre-2: #4d4d5c; --encre-3: #7a7a88; }
body { background: var(--fond); color: var(--encre); }
.ecran { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; padding: 0 var(--gouttiere); }
.gauche { max-width: 520px; }
.gauche .marque { margin-bottom: 40px; color: var(--encre); }
.pct { font-size: clamp(72px, 9vw, 150px); font-weight: 700; line-height: 0.88; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
.pct small { font-size: 0.36em; color: var(--encre-3); margin-left: 6px; letter-spacing: 0; }
.etat { margin: 14px 0 0; font-size: 15px; color: var(--encre-2); }
.etat em { font-style: normal; color: #1f6fc4; font-variant-numeric: tabular-nums; }
.gauche .go { margin-top: 32px; background: #fff; border-color: #cfd1dc; color: var(--encre); }
.pret .gauche .go { background: var(--encre); color: #fff; border-color: transparent; }
.avis { margin: 14px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--encre-3); max-width: 46ch; }
.avis strong { color: var(--encre-2); }
.etiquette { background: rgba(255, 255, 255, 0.8); border-color: #d6d8e2; color: var(--encre-3); }

.imprimante { position: relative; align-self: start; justify-self: center; width: 440px; height: 100vh; }
.fente {
  position: absolute; left: 0; right: 0; top: 0; height: 74px; z-index: 2;
  border-radius: 0 0 18px 18px;
  background: linear-gradient(180deg, #2b2b34, #1d1d24);
  box-shadow: 0 12px 24px rgba(20, 20, 40, 0.25), inset 0 -2px 0 rgba(255, 255, 255, 0.06);
}
.fente::after { content: ''; position: absolute; left: 30px; right: 30px; bottom: 14px; height: 6px; border-radius: 3px; background: #0b0b0f; }
.fente i { position: absolute; right: 26px; top: 22px; width: 8px; height: 8px; border-radius: 50%; background: #4ea8f5; box-shadow: 0 0 8px #4ea8f5; }
.pret .fente i { background: #38d18a; box-shadow: 0 0 8px #38d18a; }
.papier {
  position: absolute; left: 44px; right: 44px; top: 56px;
  padding: 26px 26px 30px; background: #fdfdfb;
  font: 500 13.5px/1.65 var(--mono-jb); color: #22222b; white-space: pre;
  box-shadow: 0 18px 40px rgba(20, 20, 40, 0.16), 0 2px 4px rgba(20, 20, 40, 0.08);
  transform: translateY(var(--sortie, 0px));
}
.papier.dechire { -webkit-mask: linear-gradient(#000, #000) top / 100% calc(100% - 10px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 16px 10px repeat-x; mask: linear-gradient(#000, #000) top / 100% calc(100% - 10px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 16px 10px repeat-x; }
.papier .c { display: inline-block; width: 100%; text-align: center; }
.papier .g { font-weight: 800; font-size: 1.35em; letter-spacing: 0.08em; }
.papier .cours { color: #1f6fc4; }
.papier .att { color: #a0a0ad; }
.papier .tete { display: inline-block; width: 0.6em; height: 1em; vertical-align: -0.15em; background: #1f6fc4; animation: clignote 0.6s steps(1) infinite; }
@keyframes clignote { 50% { opacity: 0; } }
.code { display: flex; justify-content: center; gap: 0; height: 40px; margin-top: 8px; }
.code i { display: block; background: #22222b; }
</style>
</head>
<body>
<main class="ecran">
  <section class="gauche">
    <span class="marque"><span class="lambda"></span>Aurora</span>
    <div class="pct" id="pct" role="progressbar" aria-label="Chargement du catalogue" aria-valuemin="0" aria-valuemax="100">0<small>%</small></div>
    <p class="etat" id="etat">Le catalogue est chargé en entier, pour que rien ne rame ensuite.</p>
    <button class="go" type="button" id="continuer">Continuer sans attendre</button>
    <p class="avis" id="avis">L’app s’ouvrira tout de suite, mais elle <strong>peut ramer</strong> le temps que le reste arrive : chaque écran chargera ce qui lui manque à son ouverture.</p>
  </section>
  <div class="imprimante" aria-hidden="true">
    <div class="fente"><i></i></div>
    <div class="papier" id="papier"></div>
  </div>
</main>
<span class="etiquette">Chargement · Variante 11 · Le ticket — thème clair</span>

<script src="../commun.js"></script>
<script>
'use strict';
(() => {
  const { ETAPES, chargement, fmt, hasard } = Aurora;
  const $ = (id) => document.getElementById(id);
  const LARG = 32;
  const NOMS = ['CATÉGORIES', 'FILMS', 'SÉRIES', 'CHAÎNES', 'GUIDE TV'];
  const ligne = (g, d) => `${g} ${'.'.repeat(Math.max(1, LARG - [...g].length - [...d].length - 2))} ${d}`;
  const n = (v) => fmt(v).replace(/ /g, ' ');
  const alea = hasard(8);
  const code = Array.from({ length: 44 }, () => `<i style="width:${1 + Math.floor(alea() * 3)}px;margin-right:${1 + Math.floor(alea() * 2)}px"></i>`).join('');

  let cle = '';
  chargement({
    rendu(etat) {
      const L = [
        '<span class="c g">Λ AURORA</span>',
        '<span class="c">Chargement du catalogue</span>',
        '<span class="c">Mon abonnement</span>',
        '<span class="c">fournisseur.example:8080</span>',
        `<span class="c">04/10/2026      21:34:${String(7 + Math.floor(etat.t)).padStart(2, '0')}</span>`,
        '-'.repeat(LARG),
      ];
      etat.etapes.forEach((e, i) => {
        if (e.etat === 'fait') L.push(ligne(NOMS[i], n(e.cible)));
        else if (e.etat === 'encours') L.push(`<span class="cours">${ligne(NOMS[i], `${n(e.n)}`)}</span><span class="tete"></span>`);
      });
      if (etat.fini) {
        const total = ETAPES.reduce((s, e) => s + e.cible, 0);
        L.push('-'.repeat(LARG), ligne('ÉLÉMENTS', n(total)), ligne('DURÉE', `${(Aurora.TOTAL + Aurora.ATTENTE).toFixed(1).replace('.', ',')} s`), '='.repeat(LARG),
          '<span class="c">TOUT EST LÀ.</span>', '<span class="c">Tes identifiants restent</span>', '<span class="c">sur ce PC.</span>', `<span class="code">${code}</span>`);
      } else {
        for (let i = etat.courante + 1; i < 5; i++) L.push(`<span class="att">${ligne(NOMS[i], 'à venir')}</span>`);
      }
      const html = L.join('\n');
      if (html !== cle) {
        cle = html;
        const p = $('papier');
        p.innerHTML = html;
        p.classList.toggle('dechire', etat.fini);
        // Le papier sort de la fente : plus il est long, plus il descend.
        p.style.setProperty('--sortie', `${Math.max(0, Math.min(innerHeight * 0.18, (p.offsetHeight - 460) * 0.2))}px`);
      }
      const pc = Math.round(etat.p * 100);
      $('pct').innerHTML = `${pc}<small>%</small>`;
      $('pct').setAttribute('aria-valuenow', pc);
      const c = etat.etapes[etat.courante];
      $('etat').innerHTML = etat.fini ? 'Tout est là. Les écrans s’ouvriront d’un coup.'
        : etat.t < Aurora.ATTENTE ? 'On se connecte à ton serveur…' : `${c.nom} — <em>${fmt(c.n)}</em> sur ${fmt(c.cible)} · encore ${Math.max(1, Math.round(etat.reste))} s`;
      document.body.classList.toggle('pret', etat.fini);
      $('avis').hidden = etat.fini;
      $('continuer').textContent = etat.fini ? 'Ouvrir Aurora' : 'Continuer sans attendre';
    },
  });
})();
</script>
</body>
</html>
