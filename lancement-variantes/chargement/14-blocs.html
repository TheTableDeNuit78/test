<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chargement · Blocs</title>
<link rel="stylesheet" href="../commun.css">
<link rel="stylesheet" href="../polices.css">
<style>
/*
 * Variante 14 — « Les blocs ».
 * Le chargement en jeu d'arcade : des pièces tombent dans le puits et s'empilent jusqu'à former
 * le Λ, case par case. Une couleur par étape, de bas en haut ; la silhouette du Λ attend en
 * filigrane. L'affichage à gauche parle comme une borne : score (les éléments reçus), niveau
 * (l'étape), pièce suivante. À 100 %, le Λ clignote une fois : niveau terminé.
 */
body { background: #07070b; }
.ecran { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 0.6fr); align-items: center; gap: 4vw; padding: 0 var(--gouttiere); font-family: var(--crt); }
.hud { display: grid; gap: 22px; justify-self: end; text-align: right; color: #e8e8f0; }
.hud .marque { justify-self: end; font-family: var(--font); }
.hud dl { margin: 0; display: grid; gap: 14px; }
.hud dt { font-size: 20px; letter-spacing: 0.12em; color: #8a8aa0; }
.hud dd { margin: 0; font-size: clamp(34px, 3.2vw, 52px); line-height: 1; font-variant-numeric: tabular-nums; }
.hud dd.cours { color: var(--etat-cours); }
.hud .pct { font-size: clamp(80px, 8vw, 132px); line-height: 0.85; color: #fff; }
#puits { display: block; }
.droite { display: grid; gap: 18px; align-content: center; font-size: 22px; color: #c9c9da; }
.suivante { display: grid; gap: 10px; }
.suivante span { letter-spacing: 0.12em; color: #8a8aa0; }
.suivante canvas { width: 120px; height: 90px; border: 2px solid #2a2a38; background: #0d0d14; }
.legende { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 20px; }
.legende li { display: flex; align-items: center; gap: 10px; }
.legende i { width: 16px; height: 16px; background: var(--c); box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.35), inset -2px -2px 0 rgba(0, 0, 0, 0.35); }
.legende li.attente { color: #55556a; }
.legende li.attente i { opacity: 0.3; }
.legende b { margin-left: auto; font-weight: 400; color: #8a8aa0; }
.legende .fait b { color: var(--ok); }
.legende .encours b { color: var(--etat-cours); }
.touche { all: unset; cursor: pointer; margin-top: 8px; font-size: 22px; color: #fff; }
.touche kbd { font: inherit; padding: 0 8px; margin-right: 8px; background: #e8e8f0; color: #07070b; }
.touche:focus-visible { outline: 2px solid #7c5cff; }
.avis { margin: 0; font-family: var(--font); font-size: 12.5px; line-height: 1.55; color: #6f6f86; max-width: 34ch; }
.clignote { animation: clig 0.5s steps(2) 3; }
@keyframes clig { 50% { filter: brightness(2.2); } }
</style>
</head>
<body>
<main class="ecran">
  <section class="hud">
    <span class="marque"><span class="lambda"></span>Aurora</span>
    <div class="pct" id="pct" role="progressbar" aria-label="Chargement du catalogue" aria-valuemin="0" aria-valuemax="100">0%</div>
    <dl>
      <div><dt>SCORE</dt><dd id="score">0</dd></div>
      <div><dt>NIVEAU</dt><dd id="niveau">1 / 5</dd></div>
      <div><dt>EN COURS</dt><dd class="cours" id="cours">CONNEXION</dd></div>
    </dl>
  </section>
  <canvas id="puits" aria-hidden="true"></canvas>
  <section class="droite">
    <div class="suivante"><span>SUIVANT</span><canvas id="suiv" width="120" height="90" aria-hidden="true"></canvas></div>
    <ul class="legende" id="legende"></ul>
    <button class="touche" type="button" id="continuer"><kbd>ESPACE</kbd>CONTINUER SANS ATTENDRE</button>
    <p class="avis" id="avis">L’app s’ouvre tout de suite, mais elle peut ramer le temps que le reste arrive : chaque écran chargera ce qui lui manque à son ouverture.</p>
  </section>
</main>
<span class="etiquette">Chargement · Variante 14 · Les blocs</span>

<script src="../commun.js"></script>
<script>
'use strict';
(() => {
  const { ETAPES, TOTAL, chargement, fmt } = Aurora;
  const $ = (id) => document.getElementById(id);
  const TEINTES = ['#f5a524', '#f57ab8', '#b18cff', '#4ea8f5', '#2fd0c8'];
  const NOMS = ['CATÉGORIES', 'FILMS', 'SÉRIES', 'CHAÎNES', 'GUIDE'];
  const COLS = 20, RANGS = 24;

  // Les cases du Λ, dans la grille du puits ; on les remplit de bas en haut, comme une pile.
  const L = [3.2, 23], S = [10, 1.5], R = [16.8, 23];
  const dist = (p, a, b) => { const vx = b[0] - a[0], vy = b[1] - a[1], t = Math.max(0, Math.min(1, ((p[0] - a[0]) * vx + (p[1] - a[1]) * vy) / (vx * vx + vy * vy))); return Math.hypot(p[0] - a[0] - vx * t, p[1] - a[1] - vy * t); };
  const cases = [];
  for (let y = RANGS - 1; y >= 0; y--) for (let x = 0; x < COLS; x++) if (Math.min(dist([x + 0.5, y + 0.5], L, S), dist([x + 0.5, y + 0.5], S, R)) < 1.75) cases.push([x, y]);
  // Des pièces de quatre cases (la dernière peut être plus courte), chacune attribuée à une étape.
  const pieces = [];
  for (let i = 0; i < cases.length; i += 4) pieces.push(cases.slice(i, i + 4));
  let cumul = 0;
  const seuils = ETAPES.map((e) => (cumul += e.duree / TOTAL));
  pieces.forEach((p, i) => { const f = (i + 0.5) / pieces.length; p.etape = seuils.findIndex((s) => f <= s + 1e-9); p.seuil = (i + 1) / pieces.length; });

  $('legende').innerHTML = ETAPES.map((e, i) => `<li id="g${i}" style="--c:${TEINTES[i]}"><i></i>${NOMS[i]}<b></b></li>`).join('');

  const toile = $('puits'), cx = toile.getContext('2d');
  let T, dpr;
  function mesurer() {
    dpr = Math.min(2, devicePixelRatio || 1);
    T = Math.floor(Math.min((innerHeight * 0.84) / RANGS, 32));
    toile.style.width = `${COLS * T + 8}px`; toile.style.height = `${RANGS * T + 8}px`;
    toile.width = (COLS * T + 8) * dpr; toile.height = (RANGS * T + 8) * dpr;
  }
  function brique(x, y, c, a = 1) {
    cx.globalAlpha = a;
    cx.fillStyle = c; cx.fillRect(x + 1, y + 1, T - 2, T - 2);
    cx.fillStyle = 'rgba(255,255,255,0.35)'; cx.fillRect(x + 1, y + 1, T - 2, 3); cx.fillRect(x + 1, y + 1, 3, T - 2);
    cx.fillStyle = 'rgba(0,0,0,0.35)'; cx.fillRect(x + 1, y + T - 4, T - 2, 3); cx.fillRect(x + T - 4, y + 1, 3, T - 2);
    cx.globalAlpha = 1;
  }
  const lachers = new Map(); // pièce → instant où elle a commencé à tomber
  function dessiner(etat, now, fige) {
    cx.setTransform(dpr, 0, 0, dpr, 4 * dpr, 4 * dpr);
    cx.clearRect(-4, -4, COLS * T + 8, RANGS * T + 8);
    cx.fillStyle = '#0d0d14'; cx.fillRect(0, 0, COLS * T, RANGS * T);
    cx.strokeStyle = 'rgba(255,255,255,0.03)';
    for (let x = 0; x <= COLS; x++) { cx.beginPath(); cx.moveTo(x * T, 0); cx.lineTo(x * T, RANGS * T); cx.stroke(); }
    for (let y = 0; y <= RANGS; y++) { cx.beginPath(); cx.moveTo(0, y * T); cx.lineTo(COLS * T, y * T); cx.stroke(); }
    // La silhouette qui attend.
    cx.strokeStyle = 'rgba(238,238,242,0.12)';
    for (const [x, y] of cases) cx.strokeRect(x * T + 3.5, y * T + 3.5, T - 7, T - 7);
    // Les pièces : posées, ou en train de tomber.
    for (const p of pieces) {
      if (etat.p < p.seuil - 1 / pieces.length) { lachers.delete(p); continue; }
      if (!lachers.has(p)) lachers.set(p, now);
      const k = fige ? 1 : Math.min(1, (now - lachers.get(p)) / 420);
      const yMin = Math.min(...p.map(([, y]) => y));
      const chute = (1 - k * k) * (yMin + 2) * T;
      for (const [x, y] of p) brique(x * T, y * T - chute, TEINTES[p.etape]);
    }
    cx.strokeStyle = '#2a2a38'; cx.lineWidth = 4; cx.strokeRect(-2, -2, COLS * T + 4, RANGS * T + 4); cx.lineWidth = 1;
  }
  function suivante(etat) {
    const s = $('suiv').getContext('2d');
    s.clearRect(0, 0, 120, 90);
    const p = pieces.find((q) => etat.p < q.seuil - 1 / pieces.length);
    if (!p) return;
    const xs = p.map(([x]) => x), ys = p.map(([, y]) => y);
    const x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0 + 1, h = Math.max(...ys) - y0 + 1;
    const t = 18, ox = (120 - w * t) / 2, oy = (90 - h * t) / 2;
    for (const [x, y] of p) {
      s.fillStyle = TEINTES[p.etape]; s.fillRect(ox + (x - x0) * t + 1, oy + (y - y0) * t + 1, t - 2, t - 2);
      s.fillStyle = 'rgba(255,255,255,0.35)'; s.fillRect(ox + (x - x0) * t + 1, oy + (y - y0) * t + 1, t - 2, 2);
    }
  }

  mesurer();
  addEventListener('resize', mesurer);
  addEventListener('keydown', (e) => { if (e.key === ' ' && document.activeElement === document.body) { e.preventDefault(); $('continuer').focus(); } });
  let finiAvant = false;
  chargement({
    rendu(etat, { fige }) {
      const now = performance.now();
      dessiner(etat, now, fige);
      suivante(etat);
      const total = etat.etapes.reduce((s, e) => s + e.n, 0);
      $('score').textContent = fmt(total);
      $('pct').textContent = `${Math.round(etat.p * 100)}%`;
      $('pct').setAttribute('aria-valuenow', Math.round(etat.p * 100));
      $('niveau').textContent = `${Math.min(5, etat.finies + 1)} / 5`;
      $('cours').textContent = etat.fini ? 'TERMINÉ' : etat.t < Aurora.ATTENTE ? 'CONNEXION' : NOMS[etat.courante];
      etat.etapes.forEach((e, i) => { const li = $(`g${i}`); li.className = e.etat; li.lastChild.textContent = e.etat === 'attente' ? '—' : fmt(e.n); });
      if (etat.fini && !finiAvant) { toile.classList.remove('clignote'); void toile.offsetWidth; toile.classList.add('clignote'); }
      finiAvant = etat.fini;
      $('avis').textContent = etat.fini ? 'NIVEAU TERMINÉ — tout est là, les écrans s’ouvriront d’un coup.' : 'L’app s’ouvre tout de suite, mais elle peut ramer le temps que le reste arrive : chaque écran chargera ce qui lui manque à son ouverture.';
    },
  });
})();
</script>
</body>
</html>
