<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0e">
<title>Aurora — Mosaïque</title>
<script>document.documentElement.classList.add('js')</script>
<style>
/*
 * Variante « Mosaïque », pour une app de catalogue (Prime Video, Netflix) : on démarre le nez sur un
 * mur d'affiches qui défile, on recule, et les affiches écrivent AURORA en géant. Elles se retournent
 * une à une aux couleurs de la marque, le reste du mur tombe, puis le mot se replie exactement dans le
 * titre. Plus de 3 000 affiches générées (Canvas 2D, une planche de sprites en deux résolutions).
 */
:root {
  color-scheme: dark;
  --fond: #0a0a0e;
  --encre: #f2f0ff;
  --gris: #7c7c92;
  --gris-2: #55556a;
  --bleu: #4ea8f5;
  --violet: #9d5cff;
  --rose: #ff6cab;
  --indigo: #6a5cff;
  --verre: rgb(242 240 255 / .06);
  --verre-bord: rgb(242 240 255 / .12);
  --police: 'Familjen Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  /* Échelle de la marque : 1 = la maquette en 1280 × 800. Le script l'ajuste à l'écran. */
  --k: 1;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--fond);
  color: var(--encre);
  font-family: var(--police);
  -webkit-font-smoothing: antialiased;
}

.scene {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.toile {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.js:not(.pret) .marque { opacity: 0; }

/* La marque posée : mêmes tailles que la maquette validée, quelle que soit la variante. */
.marque {
  position: relative;
  display: grid;
  justify-items: center;
}
.a-boite {
  width: calc(var(--k) * 168.75px);
  aspect-ratio: 36 / 39;
}
.a {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.a path {
  fill: none;
  stroke: url(#aurora-degrade);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.nom {
  margin: calc(var(--k) * 26px) 0 0;
  font-size: calc(var(--k) * 62px);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -.03em;
  color: var(--encre);
  white-space: nowrap;
}
.trait-boite {
  width: calc(var(--k) * 300px);
  height: max(2px, calc(var(--k) * 2px));
  margin-top: calc(var(--k) * 16px);
}
.trait {
  display: block;
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--indigo), var(--rose));
  background: linear-gradient(90deg in oklab, var(--indigo), var(--rose));
}
.sous {
  margin: calc(var(--k) * 22px) 0 0;
  padding-left: .22em;
  font-size: max(11px, calc(var(--k) * 16px));
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gris);
  white-space: nowrap;
}
.sous .l { display: inline-block; }

.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

.commandes {
  position: fixed;
  right: 20px;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  display: flex;
  gap: 8px;
  opacity: .5;
  transition: opacity .3s ease;
}
.commandes:hover,
.commandes:focus-within { opacity: 1; }
.bouton {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 15px 9px 12px;
  border: 1px solid var(--verre-bord);
  border-radius: 999px;
  background: var(--verre);
  color: var(--encre);
  font: 600 13px/1 var(--police);
  text-decoration: none;
  cursor: pointer;
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
  transition: background-color .2s ease, border-color .2s ease;
}
.bouton:hover { background: rgb(242 240 255 / .12); border-color: rgb(242 240 255 / .2); }
.bouton:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
.bouton svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.etiquette {
  position: fixed;
  left: 22px;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  margin: 0;
  font-size: 12px;
  color: var(--gris-2);
  letter-spacing: .02em;
}
.etiquette b { color: var(--gris); font-weight: 600; }
@media (max-width: 640px) {
  .commandes { right: 16px; }
  .bouton span { display: none; }
  .bouton { padding: 10px; }
  .etiquette { left: 16px; }
}


.a-boite { display: none; }
.nom {
  margin-top: 0;
  font-size: calc(var(--k) * 76px);
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding-left: .06em;
}
.trait-boite { width: calc(var(--k) * 340px); margin-top: calc(var(--k) * 20px); }
</style>

    const r = boite.getBoundingClientRect();
    const u = r.width / A.vb[2];
    const P = (vx, vy) => [r.left + (vx - A.vb[0]) * u, r.top + (vy - A.vb[1]) * u];
    return { r, u, L: P(...A.L), S: P(...A.S), R: P(...A.R), w: A.epaisseur * u / 2, centre: P(32, 32.5) };
  }

  function compilerGL(gl, vs, fs) {
    const sh = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }
  const VS_ECRAN = `#version 300 es
void main() { vec2 p = vec2(gl_VertexID == 1 ? 3. : -1., gl_VertexID == 2 ? 3. : -1.); gl_Position = vec4(p, 0., 1.); }`;

  /*
   * Le moteur commun : une horloge (celle de document.timeline, partagée par le canvas et les
   * animations du DOM), « passer » d'un clic ou d'une touche, R pour rejouer, ?t=1.2 pour figer un
   * instant, et l'état final direct pour qui demande moins d'animations.
   */
  // Une piste est soit une animation Web Animations, soit un pilote de bibliothèque (GSAP, anime.js)
  // qui sait démarrer à une heure donnée, sauter à un instant et s'annuler.
  const estWaapi = (a) => typeof Animation !== 'undefined' && a instanceof Animation;
  const demarrerPiste = (a, t0, now) => (estWaapi(a) ? (a.startTime = t0) : a.demarrer(Math.max(0, (now - t0) / 1000)));
  const figerPiste = (a, t) => (estWaapi(a) ? (a.pause(), (a.currentTime = t * 1000)) : a.aller(t));
  const annulerPiste = (a) => (estWaapi(a) ? a.cancel() : a.annuler());

  function lancer({ FIN, preparer, dessiner, animer, ambiant = false }) {
    let anims = [], t0 = 0, raf = 0, reduit = false;
    let fige = params.has('t') ? Math.max(0, parseFloat(params.get('t')) || 0) : null;
    const maintenant = () => (document.timeline && document.timeline.currentTime) ?? performance.now();
    const temps = (now = maintenant()) => fige ?? Math.max(0, (now - t0) / 1000);

    function boucle(now) {
      const t = temps(now);
      if (dessiner) dessiner(t, reduit);
      if (fige == null && !ambiant && t > FIN + .4) { raf = 0; return; }
      raf = requestAnimationFrame(boucle);
    }
    function jouer() {
      for (const a of anims) annulerPiste(a);
      reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
      majEchelle();
      if (preparer) preparer(reduit);
      anims = animer();
      t0 = maintenant() - (reduit ? FIN * 1000 : 0);
      const now = maintenant();
      // Moins d'animations : chaque piste est posée directement sur sa dernière image.
      for (const a of anims) {
        if (reduit) figerPiste(a, Math.max(FIN, fige ?? 0));
        else if (fige != null) figerPiste(a, fige); else demarrerPiste(a, t0, now);
      }
      racine.classList.add('pret');
      if (!raf) raf = requestAnimationFrame(boucle);
    }
    function passer() {
      if (fige != null || temps() >= FIN) return;
      const now = maintenant();
      t0 = now - FIN * 1000;
      // On saute à la fin par currentTime / finish() : changer startTime laisse parfois Chrome
      // afficher l'ancienne image des animations confiées au compositeur.
      for (const a of anims) {
        if (!estWaapi(a)) { demarrerPiste(a, t0, now); continue; }
        if (a.effect.getComputedTiming().endTime <= FIN * 1000) a.finish();
        else { a.currentTime = FIN * 1000; a.play(); }
      }
      // Après un saut, Chrome peut garder à l'écran l'image d'avant : on force un repeint, invisible à l'œil.
      document.body.style.opacity = '.999';
      requestAnimationFrame(() => requestAnimationFrame(() => { document.body.style.opacity = ''; }));
      if (!raf) raf = requestAnimationFrame(boucle);
    }

    addEventListener('pointerdown', (e) => {
      if (e.target.closest && e.target.closest('.commandes')) return;
      passer();
    }, { passive: true });
    addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
      if (e.target.closest && e.target.closest('.commandes')) return;
      const k = e.key.toLowerCase();
      if (k === 'r') jouer();
      else if (k !== 'tab' && k !== 'shift') passer();
    });
    $('rejouer').addEventListener('click', jouer);
    let minuterie = 0;
    addEventListener('resize', () => {
      clearTimeout(minuterie);
      minuterie = setTimeout(() => {
        majEchelle();
        if (preparer) preparer(reduit, true);
        if (!raf) raf = requestAnimationFrame(boucle);
      }, 120);
    });

    window.aurora = {
      jouer,
      passer,
      aller(t) { fige = t; for (const a of anims) figerPiste(a, t); if (!raf) raf = requestAnimationFrame(boucle); },
    };

    (async () => {
      majEchelle();
      try { await Promise.race([document.fonts.load('600 62px "Familjen Grotesk"', 'Aurora'), attendre(1500)]); } catch { /* repli */ }
      if (document.hidden) await new Promise((r) => document.addEventListener('visibilitychange', r, { once: true }));
      jouer();
    })();
  }


  const el = { toile: $('toile'), nom: $('nom'), trait: $('trait'), sous: $('sous') };
  const lettresSous = eclater(el.sous, true);
  const x = el.toile.getContext('2d');
  const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  /* ───────────── Les affiches ───────────── */

  const TITRES = ['Nord', 'Orbite', 'La Nuit bleue', 'Le Phare', 'Minuit', 'Polaris', 'Les Cimes', 'Néon', 'Dérive', 'Équinoxe', 'Halo', 'Boréal', 'Lumen', 'Zénith', 'Aube', 'Marées', 'Vertige', 'L’Île', 'Sillage', 'Cobalt', 'Opale', 'Fréquence', 'Kilomètre 0', 'Saison 3'];
  const AMBIANCES = [
    ['#0f3b5c', '#f2a65a'], ['#2b1055', '#d53369'], ['#0b3d2e', '#9be15d'], ['#3a0f2a', '#ff8a5c'], ['#101935', '#4ea8f5'],
    ['#3d2b1f', '#f6d365'], ['#1a1a2e', '#e94560'], ['#0d2b45', '#7fdbff'], ['#2d0b3a', '#9d5cff'], ['#22313f', '#e0e0e0'],
    ['#4a1c40', '#ff6cab'], ['#13293d', '#ffbe0b'],
  ];
  const NB = 48, PW = 120, PH = 180;
  function planche(echelle) {
    const c = document.createElement('canvas');
    c.width = 8 * PW * echelle; c.height = 6 * PH * echelle;
    const p = c.getContext('2d');
    const fam = getComputedStyle(document.body).fontFamily;
    for (let i = 0; i < NB; i++) {
      const [c0, c1] = AMBIANCES[i % AMBIANCES.length], ox = (i % 8) * PW, oy = ((i / 8) | 0) * PH;
      p.save();
      p.scale(echelle, echelle);
      p.translate(ox, oy);
      p.beginPath(); p.rect(0, 0, PW, PH); p.clip();
      const g = p.createLinearGradient(0, 0, PW * (hash(i) - .2), PH);
      g.addColorStop(0, c0); g.addColorStop(1, c1);
      p.fillStyle = g; p.fillRect(0, 0, PW, PH);
      const motif = i % 6;
      p.globalAlpha = .85;
      if (motif === 0) { p.fillStyle = c1; p.beginPath(); p.arc(PW * .5, PH * .42, PW * .3, 0, 7); p.fill(); p.fillStyle = c0; p.fillRect(0, PH * .55, PW, PH); }
      else if (motif === 1) { p.strokeStyle = 'rgba(255,255,255,.35)'; p.lineWidth = 6; for (let k = -6; k < 10; k++) { p.beginPath(); p.moveTo(k * 22, 0); p.lineTo(k * 22 + 90, PH); p.stroke(); } }
      else if (motif === 2) { p.strokeStyle = 'rgba(255,255,255,.5)'; p.lineWidth = 2; for (let r = 10; r < 90; r += 12) { p.beginPath(); p.arc(PW * .5, PH * .4, r, 0, 7); p.stroke(); } }
      else if (motif === 3) { p.fillStyle = 'rgba(0,0,0,.45)'; p.beginPath(); p.moveTo(0, PH * .7); for (let k = 0; k <= 8; k++) p.lineTo(k * PW / 8, PH * (.48 + hash(i * 9 + k) * .2)); p.lineTo(PW, PH); p.lineTo(0, PH); p.fill(); }
      else if (motif === 4) { p.fillStyle = 'rgba(255,255,255,.88)'; p.font = `700 ${PH * .55}px ${fam}`; p.textAlign = 'center'; p.fillText(String((i % 9) + 1), PW / 2, PH * .62); }
      else { p.fillStyle = 'rgba(0,0,0,.55)'; p.beginPath(); p.arc(PW * .5, PH * .36, PW * .13, 0, 7); p.fill(); p.beginPath(); p.moveTo(PW * .26, PH * .78); p.quadraticCurveTo(PW * .5, PH * .4, PW * .74, PH * .78); p.fill(); }
      p.globalAlpha = 1;
      const v = p.createLinearGradient(0, PH * .55, 0, PH);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.75)');
      p.fillStyle = v; p.fillRect(0, PH * .55, PW, PH);
      p.fillStyle = '#fff'; p.textAlign = 'left';
      p.font = `700 ${i % 3 ? 15 : 13}px ${fam}`;
      p.fillText(TITRES[i % TITRES.length].toUpperCase(), 9, PH - 26, PW - 16);
      p.fillStyle = 'rgba(255,255,255,.65)'; p.font = `500 9px ${fam}`;
      p.fillText(i % 4 ? 'FILM' : 'SÉRIE', 9, PH - 12);
      p.fillStyle = 'rgba(255,255,255,.9)'; p.fillRect(PW - 26, 8, 18, 10);
      p.fillStyle = c0; p.font = `700 7px ${fam}`; p.fillText(i % 2 ? '4K' : 'HD', PW - 23, 16);
      p.restore();
    }
    return c;
  }
  let grande = null, petite = null;

  /* ───────────── Le mur et le mot ───────────── */

  let mur = null;
  function construireMur(W, H, k) {
    const tw = Math.max(7, 12 * k), th = tw * 1.5, gap = tw * .28, px = tw + gap, py = th + gap;
    const cols = Math.ceil(W / px) + 8, rows = Math.ceil(H / py) + 8;
    const ox = W / 2 - (cols * px) / 2, oy = H / 2 - (rows * py) / 2;
    // Le mot en géant, à l'échelle du mur.
    const fam = getComputedStyle(document.body).fontFamily;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const p = c.getContext('2d');
    let taille = Math.min(W * .2, H * .36);
    p.font = `700 ${taille}px ${fam}`;
    p.letterSpacing = '.06em';
    const largeur = p.measureText('AURORA').width;
    if (largeur > W * .86) { taille *= W * .86 / largeur; p.font = `700 ${taille}px ${fam}`; }
    p.textAlign = 'center'; p.textBaseline = 'middle'; p.fillStyle = '#fff';
    p.fillText('AURORA', W / 2, H / 2);
    const encre = p.getImageData(0, 0, W, H).data;
    const m = p.measureText('AURORA');
    const motG = { x0: W / 2 - m.width / 2, x1: W / 2 + m.width / 2, y0: H / 2 - m.actualBoundingBoxAscent, y1: H / 2 + m.actualBoundingBoxDescent };
    const tuiles = [];
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const tx = ox + i * px, ty = oy + j * py, cx = tx + tw / 2, cy = ty + th / 2;
      const dedans = cx >= 0 && cy >= 0 && cx < W && cy < H && encre[((cy | 0) * W + (cx | 0)) * 4 + 3] > 120;
      const n = j * cols + i;
      tuiles.push({ x: tx, y: ty, n, affiche: (hash(n) * NB) | 0, mot: dedans, d: Math.hypot(cx - W / 2, cy - H / 2) / Math.hypot(W, H) });
    }
    // Couleur de chaque tuile du mot : le dégradé de la marque, de gauche à droite.
    const B = rvb('#4ea8f5'), V = rvb('#9d5cff'), R = rvb('#ff6cab');
    for (const q of tuiles) {
      if (!q.mot) continue;
      const g = clamp((q.x - motG.x0) / Math.max(1, motG.x1 - motG.x0), 0, 1);
      const c = g < .5 ? B.map((v, i) => mix(v, V[i], g * 2)) : V.map((v, i) => mix(v, R[i], g * 2 - 1));
      q.couleur = `rgb(${c.map((v) => Math.round(v * 255)).join(',')})`;
    }
    // Où se trouve l'encre du titre dans sa boîte du DOM, pour que le mot replié tombe pile dessus.
    const fsDom = parseFloat(getComputedStyle(el.nom).fontSize), ratio = fsDom / taille;
    const encreDom = { asc: m.actualBoundingBoxAscent * ratio, desc: m.actualBoundingBoxDescent * ratio, fa: m.fontBoundingBoxAscent * ratio, fd: m.fontBoundingBoxDescent * ratio };
    return { tuiles, tw, th, motG, encreDom };
  }

  /* ───────────── Le rendu d'une image ───────────── */

  function dessiner(t) {
    if (el.toile.hidden || !mur) return;
    const dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
    if (el.toile.width !== Math.round(W * dpr)) { el.toile.width = Math.round(W * dpr); el.toile.height = Math.round(H * dpr); }
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.fillStyle = '#0a0a0e';
    x.fillRect(0, 0, el.toile.width, el.toile.height);

    // La caméra : gros plan qui défile, puis recul.
    const r = enDouceur(lisse(.45, 2.1, t));
    const zoom = Math.exp(mix(Math.log(9), 0, r));
    const fx = mix(W / 2 - 60 + t * 140, W / 2, r), fy = mix(H / 2 - 20, H / 2, r);
    const rot = mix(-.07, 0, r);
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.translate(W / 2, H / 2); x.rotate(rot); x.scale(zoom, zoom); x.translate(-fx, -fy);
    const { tw, th, motG } = mur;
    const src = zoom * tw > 34 ? grande : petite, e = src === grande ? 2 : .25;
    const dom = el.nom.getBoundingClientRect();
    const replie = enDouceur(lisse(2.55, 3.05, t));
    const s = mix(1, dom.width / (motG.x1 - motG.x0), replie);
    const ed = mur.encreDom, base = dom.top + (dom.height - ed.fa - ed.fd) / 2 + ed.fa;
    const mcx = (motG.x0 + motG.x1) / 2, mcy = (motG.y0 + motG.y1) / 2, dcx = dom.left + dom.width / 2, dcy = base - (ed.asc - ed.desc) / 2;
    const marge = Math.max(tw, th) * 2, vx0 = fx - W / 2 / zoom - marge, vx1 = fx + W / 2 / zoom + marge, vy0 = fy - H / 2 / zoom - marge, vy1 = fy + H / 2 / zoom + marge;
    const sombre = lisse(1.35, 2.05, t);

    for (const q of mur.tuiles) {
      if (!q.mot) {
        // Le reste du mur s'assombrit, puis tombe, du centre vers les bords.
        const tc = 2.0 + q.d * .9;
        const chute = lisse(tc, tc + .35, t);
        const a = (1 - .8 * sombre) * (1 - chute);
        if (a <= .01 || q.x + tw < vx0 || q.x > vx1 || q.y + th < vy0 || q.y > vy1) continue;
        const sc = 1 - .45 * chute, dy = chute * chute * th * 2.5;
        x.globalAlpha = a;
        x.drawImage(src, (q.affiche % 8) * PW * e, ((q.affiche / 8) | 0) * PH * e, PW * e, PH * e,
          q.x + tw * (1 - sc) / 2, q.y + th * (1 - sc) / 2 + dy, tw * sc, th * sc);
        continue;
      }
      // Les affiches du mot se retournent en vague, de gauche à droite, puis le mot se replie dans le titre.
      const xn = (q.x - motG.x0) / Math.max(1, motG.x1 - motG.x0);
      const tf = 1.45 + xn * .55 + hash(q.n + 7) * .12;
      const f = lisse(tf, tf + .32, t);
      const cs = Math.abs(Math.cos(f * Math.PI));
      let X = q.x, Y = q.y, w = tw, h = th;
      if (replie > 0) {
        X = mix(q.x, dcx + (q.x - mcx) * s, replie); Y = mix(q.y, dcy + (q.y - mcy) * s, replie);
        w = mix(tw, tw * s, replie) * 1.18; h = mix(th, th * s, replie) * 1.08;
      }
      if (X + w < vx0 || X > vx1 || Y + h < vy0 || Y > vy1) continue;
      x.globalAlpha = 1 - lisse(3.0, 3.25, t);
      if (f < .5) {
        x.drawImage(src, (q.affiche % 8) * PW * e, ((q.affiche / 8) | 0) * PH * e, PW * e, PH * e, X + w * (1 - cs) / 2, Y, w * cs, h);
      } else {
        x.fillStyle = q.couleur;
        x.fillRect(X + w * (1 - cs) / 2, Y, w * cs, h);
      }
    }
    x.globalAlpha = 1;
  }

  lancer({
    FIN: 4.0,
    preparer(reduit) {
      el.toile.hidden = reduit;
      if (reduit) return;
      if (!grande) { grande = planche(2); petite = planche(.25); }
      mur = construireMur(innerWidth, innerHeight, parseFloat(racine.style.getPropertyValue('--k')) || 1);
    },
    dessiner,
    animer() {
      const L = [];
      const anim = (cible, kf, delai, duree, easing = 'cubic-bezier(.2,.7,.2,1)') =>
        L.push(cible.animate(kf, { delay: delai * 1000, duration: duree * 1000, easing, fill: 'both' }));
      anim(el.nom, [{ opacity: 0 }, { opacity: 1 }], 2.95, .3, 'ease-out');
      anim(el.toile, [{ opacity: 1 }, { opacity: 0 }], 3.2, .2, 'linear');
      anim(el.trait, [{ transform: 'scaleX(0)', opacity: 0 }, { opacity: 1, offset: .15 }, { transform: 'scaleX(1)', opacity: 1 }], 3.15, .55, 'cubic-bezier(.2,.8,.2,1)');
      lettresSous.forEach((l, i) => anim(l, [{ opacity: 0, transform: 'translateY(.5em)' }, { opacity: 1, transform: 'translateY(0)' }], 3.35 + i * .014, .45));
      return L;
    },
  });
})();
</script>
</body>
