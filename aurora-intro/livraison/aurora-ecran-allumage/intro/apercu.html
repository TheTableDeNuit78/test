:root {
  color-scheme: dark;
  --fond: #0a0a0e;
  --encre: #f2f0ff;
  --gris: #7c7c92;
  --gris-2: #55556a;
  --bleu: #4ea8f5;
  --violet: #9d5cff;
  --rose: #ff6cab;
  --indigo: #6a5cff;
  --verre: rgb(242 240 255 / .06);
  --verre-bord: rgb(242 240 255 / .12);
  --police: 'Familjen Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  /* Échelle de la marque : 1 = la maquette en 1280 × 800. Le script l'ajuste à l'écran. */
  --k: 1;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--fond);
  color: var(--encre);
  font-family: var(--police);
  -webkit-font-smoothing: antialiased;
}

/* ───────────── L'app, là où l'intro débouche ───────────── */
.app {
  position: fixed;
  inset: 0;
  z-index: 1;
  overflow: hidden;
  background: var(--fond);
}
.js:not(.pret) .app { opacity: 0; }
.app-cadre {
  height: 100%;
  padding: 0 clamp(16px, 3.4vw, 48px);
}
.app-haut {
  display: flex;
  align-items: center;
  gap: clamp(18px, 3.4vw, 44px);
  height: 72px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-a {
  display: block;
  height: 25px;
  aspect-ratio: 36 / 39;
  overflow: visible;
}
.logo-a path {
  fill: none;
  stroke: url(#aurora-degrade);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.logo-nom {
  display: block;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -.03em;
}
.onglets {
  display: flex;
  gap: 24px;
  font-size: 14.5px;
  font-weight: 500;
  color: var(--gris);
  white-space: nowrap;
}
.onglets .actif { position: relative; color: var(--encre); }
.onglets .actif::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -9px;
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--indigo), var(--rose));
}
.app-outils {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-left: auto;
}
.rond {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--verre-bord);
  border-radius: 50%;
  background: var(--verre);
}
.rond svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: var(--encre);
  stroke-width: 1.7;
  stroke-linecap: round;
}
.avatar { border: 0; background: linear-gradient(135deg, var(--bleu), var(--violet) 55%, var(--rose)); }
.app-corps {
  display: grid;
  gap: clamp(18px, 3.4vh, 30px);
  padding-top: 4px;
}

/* La une : un ciel d'aurore boréale aux couleurs d'Aurora, en dégradés. */
.une {
  position: relative;
  height: clamp(220px, 47vh, 440px);
  overflow: hidden;
  border-radius: 20px;
  background: linear-gradient(180deg, #0b1132 0%, #161039 48%, #22113a 76%, #120a1c 100%);
  isolation: isolate;
}
.une-ciel {
  position: absolute;
  inset: -25% -10% 25% -10%;
  background:
    radial-gradient(34% 50% at 24% 62%, rgb(78 168 245 / .62), transparent 70%),
    radial-gradient(30% 46% at 47% 46%, rgb(157 92 255 / .66), transparent 70%),
    radial-gradient(26% 42% at 70% 56%, rgb(255 108 171 / .5), transparent 70%),
    radial-gradient(24% 38% at 90% 36%, rgb(106 92 255 / .45), transparent 70%);
  filter: blur(22px);
  transform: skewY(-7deg);
}
.une-etoiles {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1.3px 1.3px at 8% 14%, #fff, transparent),
    radial-gradient(1px 1px at 19% 33%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 33% 9%, #fff, transparent),
    radial-gradient(1px 1px at 52% 22%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 63% 8%, #fff, transparent),
    radial-gradient(1px 1px at 77% 18%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 88% 11%, #fff, transparent),
    radial-gradient(1px 1px at 94% 29%, #fff, transparent),
    radial-gradient(1px 1px at 41% 30%, #fff, transparent);
  opacity: .7;
}
.une-monts {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 40%;
  background: #08070d;
  clip-path: polygon(0 58%, 8% 40%, 15% 52%, 26% 20%, 35% 44%, 44% 32%, 53% 50%, 64% 16%, 74% 42%, 84% 28%, 93% 46%, 100% 36%, 100% 100%, 0 100%);
}
.une-monts.loin {
  height: 52%;
  background: #15112a;
  clip-path: polygon(0 40%, 11% 24%, 21% 38%, 31% 14%, 42% 34%, 50% 22%, 60% 40%, 71% 10%, 82% 32%, 91% 20%, 100% 30%, 100% 100%, 0 100%);
}
.une::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgb(10 10 14 / .78), rgb(10 10 14 / .2) 58%, transparent);
}
.une-texte {
  position: absolute;
  left: clamp(20px, 4vw, 52px);
  bottom: clamp(20px, 5vh, 48px);
  z-index: 1;
}
.puce {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: #cfc6ff;
}
.une h2 {
  margin: 10px 0 8px;
  font-size: clamp(34px, 5.2vw, 60px);
  font-weight: 650;
  line-height: 1;
  letter-spacing: -.035em;
}
.une p { margin: 0 0 20px; font-size: 14px; color: #b9b5cc; }
.une-boutons { display: flex; gap: 10px; }
.btn-plein, .btn-verre {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 20px 11px 15px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
}
.btn-plein { background: var(--encre); color: var(--fond); }
.btn-verre { border: 1px solid rgb(242 240 255 / .2); background: rgb(242 240 255 / .12); }
.btn-plein svg, .btn-verre svg { width: 16px; height: 16px; }
.btn-plein svg path { fill: currentColor; }
.btn-verre svg path { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; }
.rangee h3 { margin: 0 0 12px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.cartes {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: clamp(170px, 18.5vw, 250px);
  gap: 14px;
}
.carte, .affiche {
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  background:
    radial-gradient(90% 80% at 80% 10%, rgb(255 255 255 / .14), transparent 60%),
    linear-gradient(135deg, var(--c1), var(--c2));
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / .06);
}
.carte { aspect-ratio: 16 / 9; }
.carte b { position: absolute; left: 12px; top: 10px; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.carte .direct {
  position: absolute;
  top: 9px;
  right: 9px;
  padding: 3px 7px;
  border-radius: 6px;
  background: rgb(10 10 14 / .45);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.carte .direct::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 5px;
  border-radius: 50%;
  background: #ff4d6d;
  vertical-align: 1px;
}
.carte .prog { position: absolute; left: 12px; bottom: 20px; font-size: 12.5px; color: rgb(255 255 255 / .78); }
.carte .progres { position: absolute; left: 12px; right: 12px; bottom: 10px; height: 3px; border-radius: 3px; background: rgb(255 255 255 / .2); }
.carte .progres i { display: block; height: 100%; border-radius: inherit; background: #fff; }
.affiches { grid-auto-columns: clamp(118px, 12.5vw, 172px); }
.affiche { aspect-ratio: 2 / 3; }
.affiche span {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 12px;
  font-size: 15px;
  font-weight: 650;
  line-height: 1.1;
  letter-spacing: -.02em;
}
@media (max-width: 760px) {
  .onglets { display: none; }
  .une-boutons .btn-verre { display: none; }
}


.logo-marque { display: block; width: 32px; height: 32px; overflow: visible; }

.app-demo { position: fixed; inset: 0; }
.rejouer {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 9500;
  padding: 9px 16px;
  border: 1px solid rgb(242 240 255 / .12);
  border-radius: 999px;
  background: rgb(242 240 255 / .06);
  color: var(--encre);
  font: 600 13px/1 var(--police);
  cursor: pointer;
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}
</style>
<style>
/* ── intro.css, tel que livré ── */
/*
 * **L'intro du lancement**, version « Allumage », avec le logo **Écran** (sans son). Les tailles
 * suivent `--k` (1 = 1280 × 800), posé par le composant selon l'écran : l'écran du logo fait
 * 236 px de côté (sa grille de 256), le nom 62 px, comme la maquette.
 *
 * Rien n'est animé ici : tout le mouvement est dans le composant (Web Animations). Ce fichier ne
 * pose que les éléments à leur place finale.
 */
.intro {
  --k: 1;
  position: fixed;
  inset: 0;
  z-index: 9000;
  overflow: hidden;
  color: #f2f0ff;
}
/* Tant que la police n'est pas là (un court instant), on ne voit que le fond. */
.intro:not(.introPret) .introScene {
  visibility: hidden;
}

/* La couche percée par la fenêtre : le fond de nuit, le cadre de l'écran et le nom. */
.introCouvert,
.introAube {
  position: absolute;
  inset: 0;
}
.introCouvert {
  background: #0a0a0e;
}
/* La couche de l'aube, par-dessus, au même endroit : elle s'efface quand l'écran s'allume. */
.introAube {
  pointer-events: none;
}
.introScene {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
}
.introMarque {
  display: block;
  width: calc(var(--k) * 236px);
  height: calc(var(--k) * 236px);
  overflow: visible;
}
.introCadreTrace {
  fill: none;
  stroke: #f2f0ff;
  stroke-width: 24;
  stroke-dasharray: 1 2;
}
.introNom {
  display: block;
  margin-top: calc(var(--k) * 14px);
  font-size: calc(var(--k) * 62px);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.03em;
  white-space: nowrap;
  clip-path: inset(-40% -10% 0 -10%);
}
.introLettre {
  display: inline-block;
}
/* Dans la couche de l'aube, le nom ne sert qu'à garder la même mise en page. */
.introCale {
  visibility: hidden;
}

/* Le cadre du DOM qui prend le relais du cadre dessiné, et grandit avec la fenêtre. */
.introCadre {
  position: fixed;
  box-sizing: border-box;
  border: 0 solid #f2f0ff;
  opacity: 0;
  pointer-events: none;
}

</style>
