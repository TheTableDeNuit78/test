<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0e">
<title>Aurora — Hyperespace</title>
<script>document.documentElement.classList.add('js')</script>
<style>
/*
 * Variante « Hyperespace » : les étoiles dérivent, le moteur se charge — elles reculent d'un cheveu —,
 * puis le saut : elles s'étirent en traits de lumière, tunnel aux couleurs de la marque, et la sortie
 * d'un coup sec, éclair, le logo devant nous. Les traînées ne sont pas dessinées : c'est le flou de
 * mouvement du moteur de particules, calculé à la vitesse réelle de chaque étoile.
 */
:root {
  color-scheme: dark;
  --fond: #0a0a0e;
  --encre: #f2f0ff;
  --gris: #7c7c92;
  --gris-2: #55556a;
  --bleu: #4ea8f5;
  --violet: #9d5cff;
  --rose: #ff6cab;
  --indigo: #6a5cff;
  --verre: rgb(242 240 255 / .06);
  --verre-bord: rgb(242 240 255 / .12);
  --police: 'Familjen Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  /* Échelle de la marque : 1 = la maquette en 1280 × 800. Le script l'ajuste à l'écran. */
  --k: 1;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--fond);
  color: var(--encre);
  font-family: var(--police);
  -webkit-font-smoothing: antialiased;
}

.scene {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.toile {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.js:not(.pret) .marque { opacity: 0; }

/* La marque posée : mêmes tailles que la maquette validée, quelle que soit la variante. */
.marque {
  position: relative;
  display: grid;
  justify-items: center;
}
.a-boite {
  width: calc(var(--k) * 168.75px);
  aspect-ratio: 36 / 39;
}
.a {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.a path {
  fill: none;
  stroke: url(#aurora-degrade);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.nom {
  margin: calc(var(--k) * 26px) 0 0;
  font-size: calc(var(--k) * 62px);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -.03em;
  color: var(--encre);
  white-space: nowrap;
}
.trait-boite {
  width: calc(var(--k) * 300px);
  height: max(2px, calc(var(--k) * 2px));
  margin-top: calc(var(--k) * 16px);
}
.trait {
  display: block;
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--indigo), var(--rose));
  background: linear-gradient(90deg in oklab, var(--indigo), var(--rose));
}
.sous {
  margin: calc(var(--k) * 22px) 0 0;
  padding-left: .22em;
  font-size: max(11px, calc(var(--k) * 16px));
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gris);
  white-space: nowrap;
}
.sous .l { display: inline-block; }

.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

.commandes {
  position: fixed;
  right: 20px;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  display: flex;
  gap: 8px;
  opacity: .5;
  transition: opacity .3s ease;
}
.commandes:hover,
.commandes:focus-within { opacity: 1; }
.bouton {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 15px 9px 12px;
  border: 1px solid var(--verre-bord);
  border-radius: 999px;
  background: var(--verre);
  color: var(--encre);
  font: 600 13px/1 var(--police);
  text-decoration: none;
  cursor: pointer;
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
  transition: background-color .2s ease, border-color .2s ease;
}
.bouton:hover { background: rgb(242 240 255 / .12); border-color: rgb(242 240 255 / .2); }
.bouton:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
.bouton svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
#son .ondes { display: none; }
#son[aria-pressed="true"] .ondes { display: inline; }
#son[aria-pressed="true"] .muet { display: none; }
#son.appel {
  border-color: rgb(255 108 171 / .55);
  background: rgb(255 108 171 / .16);
  animation: appel 1.6s ease-in-out infinite;
}
.commandes:has(.appel) { opacity: 1; }
@keyframes appel { 50% { box-shadow: 0 0 0 6px rgb(255 108 171 / .12); } }
@media (prefers-reduced-motion: reduce) { #son.appel { animation: none; } }
.etiquette {
  position: fixed;
  left: 22px;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  margin: 0;
  font-size: 12px;
  color: var(--gris-2);
  letter-spacing: .02em;
}
.etiquette b { color: var(--gris); font-weight: 600; }
@media (max-width: 640px) {
  .commandes { right: 16px; }
  .bouton span { display: none; }
  .bouton { padding: 10px; }
  .etiquette { left: 16px; }
}


.lueur {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: radial-gradient(circle at 50% 45%, rgb(106 92 255 / .32), rgb(255 108 171 / .12) 30%, transparent 62%);
  opacity: 0;
  pointer-events: none;
}
.eclair { position: fixed; inset: 0; z-index: 3; background: radial-gradient(circle at 50% 45%, #fff, rgb(200 190 255 / .5) 20%, transparent 65%); opacity: 0; pointer-events: none; }
</style>

<script>
'use strict';
(() => {
  const $ = (id) => document.getElementById(id);
  const racine = document.documentElement;
  const params = new URLSearchParams(location.search);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const mix = (a, b, k) => a + (b - a) * k;
  const lisse = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const enDouceur = (k) => (k < .5 ? 4 * k * k * k : 1 - Math.pow(2 - 2 * k, 3) / 2);
  const sortie4 = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 4);
  const attendre = (ms) => new Promise((r) => setTimeout(r, ms));
  function hasard(graine) { // mulberry32 : le même tirage à chaque lecture
    let s = graine >>> 0;
    return () => { s = (s + 0x6d2b79f5) >>> 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // Le Λ sans barre de la maquette, dans son cadre serré (14 13 36 39).
  const A = { L: [18, 48], S: [32, 17], R: [46, 48], vb: [14, 13, 36, 39], epaisseur: 5, d: 'M18 48L32 17l14 31' };
  const rvb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
  const MARQUE = [rvb('#4ea8f5'), rvb('#9d5cff'), rvb('#ff6cab')];
  const teinteMarque = (g) => { g = clamp(g, 0, 1); const [a, b] = g < .5 ? [MARQUE[0], MARQUE[1]] : [MARQUE[1], MARQUE[2]]; const k = g < .5 ? g * 2 : g * 2 - 1; return [mix(a[0], b[0], k), mix(a[1], b[1], k), mix(a[2], b[2], k)]; };

  function majEchelle() {
    const k = clamp(Math.min(innerWidth / 720, innerHeight / 800), .5, 1.3);
    racine.style.setProperty('--k', k.toFixed(4));
    return k;
  }
  const echelle = () => parseFloat(racine.style.getPropertyValue('--k')) || 1;

  function eclater(noeud, insecable) {
    const texte = noeud.textContent.trim();
    noeud.setAttribute('aria-label', texte);
    noeud.textContent = '';
    for (const ch of texte) {
      const s = document.createElement('span');
      s.className = 'l';
      s.setAttribute('aria-hidden', 'true');
      s.textContent = insecable && ch === ' ' ? ' ' : ch;
      noeud.append(s);
    }
    return [...noeud.children];
  }

  // Où se trouve le Λ à l'écran, en px CSS : ses trois sommets, sa demi-épaisseur, son centre.
  function geometrieA(boite) {
    const r = boite.getBoundingClientRect();
    const u = r.width / A.vb[2];
    const P = (vx, vy) => [r.left + (vx - A.vb[0]) * u, r.top + (vy - A.vb[1]) * u];
    const g = { r, u, L: P(...A.L), S: P(...A.S), R: P(...A.R), w: A.epaisseur * u / 2, centre: P(32, 32.5) };
    // Couleur du dégradé SVG (objectBoundingBox, de bas-gauche vers haut-droite) en un point de l'écran.
    g.couleur = (x, y) => teinteMarque(((x - g.L[0]) / (g.R[0] - g.L[0]) - (y - g.S[1]) / (g.L[1] - g.S[1]) + 1) / 2);
    // Un point du trait central, s de 0 (pied gauche) à 1 (pied droit), et sa direction.
    g.trace = (s) => { const [p, q, k] = s < .5 ? [g.L, g.S, s * 2] : [g.S, g.R, s * 2 - 1]; const dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy); return { x: p[0] + dx * k, y: p[1] + dy * k, ux: dx / l, uy: dy / l }; };
    return g;
  }

  /* ───────────── Échantillonnage : des points tirés dans l'encre d'une forme ───────────── */

  function encre(largeur, hauteur, dessiner) {
    const S = 2, c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(largeur * S)); c.height = Math.max(1, Math.ceil(hauteur * S));
    const x = c.getContext('2d', { willReadFrequently: true });
    x.scale(S, S); dessiner(x);
    const d = x.getImageData(0, 0, c.width, c.height).data, idx = [];
    for (let i = 3, p = 0; i < d.length; i += 4, p++) if (d[i] > 140) idx.push(p);
    return { idx, cw: c.width, S, aire: idx.length / (S * S) };
  }
  const tirer = (e, alea) => { const p = e.idx[(alea() * e.idx.length) | 0] || 0; return [((p % e.cw) + alea()) / e.S, (((p / e.cw) | 0) + alea()) / e.S]; };

  // n points dans le trait du Λ, avec leur abscisse curviligne s (0 → 1) et la couleur du dégradé.
  function pointsDuA(g, n, alea) {
    const e = encre(g.r.width, g.r.height, (x) => {
      x.scale(g.u, g.u); x.translate(-A.vb[0], -A.vb[1]);
      x.lineWidth = A.epaisseur; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#fff'; x.stroke(new Path2D(A.d));
    });
    const proj = (p, q, x, y) => { const dx = q[0] - p[0], dy = q[1] - p[1]; const t = clamp(((x - p[0]) * dx + (y - p[1]) * dy) / (dx * dx + dy * dy), 0, 1); return [t, Math.hypot(x - p[0] - dx * t, y - p[1] - dy * t)]; };
    const pts = [];
    for (let i = 0; i < n; i++) {
      const [lx, ly] = tirer(e, alea), x = g.r.left + lx, y = g.r.top + ly;
      const [t1, d1] = proj(g.L, g.S, x, y), [t2, d2] = proj(g.S, g.R, x, y);
      pts.push({ x, y, s: d1 <= d2 ? t1 / 2 : .5 + t2 / 2, c: g.couleur(x, y) });
    }
    return { pts, aire: e.aire };
  }

  // n points dans les lettres d'un texte du DOM (découpé en spans), avec leur position relative xf (0 → 1).
  function pointsDuTexte(spans, n, alea, majuscules = false) {
    const boite = spans[0].parentElement.getBoundingClientRect(), cs = getComputedStyle(spans[0]), m = 6;
    const e = encre(boite.width + m * 2, boite.height + m * 2, (x) => {
      x.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; x.fillStyle = '#fff'; x.textBaseline = 'alphabetic';
      for (const s of spans) {
        const ch = majuscules ? s.textContent.toUpperCase() : s.textContent;
        if (!ch.trim()) continue;
        const r = s.getBoundingClientRect(), mt = x.measureText(ch);
        x.fillText(ch, r.left - boite.left + m, r.top - boite.top + m + (mt.fontBoundingBoxAscent ?? r.height * .8));
      }
    });
    const pts = [];
    for (let i = 0; i < n; i++) {
      const [lx, ly] = tirer(e, alea), x = boite.left - m + lx, y = boite.top - m + ly;
      pts.push({ x, y, xf: clamp((x - boite.left) / Math.max(1, boite.width), 0, 1) });
    }
    return { pts, aire: e.aire, boite };
  }

  // Dessine la marque du DOM sur un canvas 2D, au pixel près (pour les textures et les relais).
  function dessinerMarque(c, { boiteA, nom, trait, sous }) {
    if (boiteA && boiteA.offsetParent !== null && getComputedStyle(boiteA).display !== 'none') {
      const g = geometrieA(boiteA), gr = c.createLinearGradient(g.L[0], g.L[1], g.R[0], g.S[1]);
      gr.addColorStop(0, '#4ea8f5'); gr.addColorStop(.5, '#9d5cff'); gr.addColorStop(1, '#ff6cab');
      c.strokeStyle = gr; c.lineWidth = g.w * 2; c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath(); c.moveTo(...g.L); c.lineTo(...g.S); c.lineTo(...g.R); c.stroke();
    }
    const ecrire = (spans) => {
      if (!spans || !spans.length) return;
      const cs = getComputedStyle(spans[0].parentElement), maj = cs.textTransform === 'uppercase';
      c.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; c.fillStyle = cs.color; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
      for (const s of spans) { const ch = maj ? s.textContent.toUpperCase() : s.textContent, r = s.getBoundingClientRect(), mt = c.measureText(ch); c.fillText(ch, r.left, r.top + (mt.fontBoundingBoxAscent ?? r.height * .8)); }
    };
    ecrire(nom); ecrire(sous);
    if (trait) {
      const rt = trait.getBoundingClientRect(), gt = c.createLinearGradient(rt.left, 0, rt.right, 0);
      gt.addColorStop(0, '#6a5cff'); gt.addColorStop(1, '#ff6cab');
      c.fillStyle = gt; c.fillRect(rt.left, rt.top, rt.width, rt.height);
    }
  }

  /*
   * L'apparition de la marque dans le DOM, partagée par les intros : le Λ net, le nom (plusieurs
   * styles), le trait qui s'étire, le sous-titre lettre à lettre. Chaque date est en secondes ; une
   * date absente laisse l'élément tel quel.
   */
  function revelerMarque({ trace, nom, lettresNom, trait, lettresSous }, { a, nom: tNom, trait: tTrait, sous: tSous, style = 'flou', dureeA = .45 } = {}) {
    const L = [];
    const anim = (cible, kf, delai, duree, easing = 'cubic-bezier(.2,.7,.2,1)') => L.push(cible.animate(kf, { delay: delai * 1000, duration: duree * 1000, easing, fill: 'both' }));
    if (trace && a != null) anim(trace, [{ opacity: 0 }, { opacity: 1 }], a, dureeA, 'ease-out');

    // pas la suivante, qui peut démarrer dans la foulée.
    let session = null;
    function ouvrirSession(c, b) {
      const sec = c.createGain(), mouille = c.createGain();
      sec.gain.value = mouille.gain.value = api.volume;
      sec.connect(chaine.m); mouille.connect(chaine.r);
      session = { sec, mouille, sources: [] };
      voix = session.sources;
      return outils(c, { m: sec, r: mouille, b: chaine.b }, session.sources);
    }
    // Joue une partition. Si le navigateur retient le son, on attend son feu vert un court instant et
    // on reprend la partition là où l'image en est ; sinon, le bouton « Activer le son » s'allume.
    api.jouer = (partition) => {
      if (!partition || !api.actif) return;
      const c = initialiser();
      if (!c) return;
      if (c.state === 'running') { api.bloque = false; maj(); partition(ouvrirSession(c), c.currentTime + .04); return; }
      const debut = performance.now();
      c.resume().then(() => {
        const ecoule = (performance.now() - debut) / 1000;
        if (c.state !== 'running' || ecoule > 1.2) return;
        api.bloque = false; maj();
        partition(ouvrirSession(c), c.currentTime + .04 - ecoule);
      }).catch(() => {});
      setTimeout(() => { if (c.state !== 'running') { api.bloque = true; maj(); } }, 300);
    };
    api.couper = (fondu = .2) => {
      if (!ac || !session) return;
      const t = ac.currentTime, s = session;
      for (const g of [s.sec, s.mouille]) { g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + fondu); }
      for (const n of s.sources) { try { n.stop(t + fondu + .02); } catch { /* déjà arrêté */ } }
      session = null;
      voix = [];
    };
    // L'analyseur de fréquences du son en cours, quand il joue vraiment (sinon null).
    api.analyseur = () => (ac && ac.state === 'running' && api.actif && session ? chaine.an : null);
    // Pour les tests : rend une partition hors ligne et mesure crête et niveau moyen.
    api.mesurer = async (partition, duree = 6) => {
      const c = new OfflineAudioContext(2, Math.round(44100 * duree), 44100);
      const g = brancher(c);
      g.vol.gain.value = 1;
      const sec = c.createGain(), mouille = c.createGain();
      sec.gain.value = mouille.gain.value = api.volume;
      sec.connect(g.m); mouille.connect(g.r);
      partition(outils(c, { m: sec, r: mouille, b: g.b }, []), .05);
      const buf = await c.startRendering();
      let crete = 0, somme = 0;
      for (let k = 0; k < 2; k++) { const d = buf.getChannelData(k); for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > crete) crete = v; somme += v * v; } }
      return { crete: +crete.toFixed(3), rms: +Math.sqrt(somme / (buf.length * 2)).toFixed(4) };
    };
    return api;
  })();

  /*
   * Le moteur commun : une horloge (celle de document.timeline, partagée par le canvas, les
   * animations du DOM et le son), « passer » d'un clic ou d'une touche, R pour rejouer, M pour le son,
   * ?t=1.2 pour figer un instant, et l'état final direct pour qui demande moins d'animations.
   */
  // Une piste est soit une animation Web Animations, soit un pilote de bibliothèque (GSAP, anime.js)
  // qui sait démarrer à une heure donnée, sauter à un instant et s'annuler.
  const estWaapi = (a) => typeof Animation !== 'undefined' && a instanceof Animation;
  const demarrerPiste = (a, t0, now) => (estWaapi(a) ? (a.startTime = t0) : a.demarrer(Math.max(0, (now - t0) / 1000)));
  const figerPiste = (a, t) => (estWaapi(a) ? (a.pause(), (a.currentTime = t * 1000)) : a.aller(t));
  const annulerPiste = (a) => (estWaapi(a) ? a.cancel() : a.annuler());

  function lancer({ FIN, preparer, dessiner, animer, sons, sonFin, ambiant = false, volume = 1 }) {
    Sono.volume = volume;
    let anims = [], t0 = 0, raf = 0, reduit = false;
    let fige = params.has('t') ? Math.max(0, parseFloat(params.get('t')) || 0) : null;
    const maintenant = () => (document.timeline && document.timeline.currentTime) ?? performance.now();
    const temps = (now = maintenant()) => fige ?? Math.max(0, (now - t0) / 1000);

    function boucle(now) {
      const t = temps(now);
      if (dessiner) dessiner(t, reduit);
      if (fige == null && !ambiant && t > FIN + .4) { raf = 0; return; }
      raf = requestAnimationFrame(boucle);
    }
    function jouer() {
      for (const a of anims) annulerPiste(a);
      Sono.couper(.05);
      reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
      majEchelle();
      if (preparer) preparer(reduit);
      anims = animer ? animer() : [];
      t0 = maintenant() - (reduit ? FIN * 1000 : 0);
      const now = maintenant();
      // Moins d'animations : chaque piste est posée directement sur sa dernière image.
      for (const a of anims) {
        if (reduit) figerPiste(a, Math.max(FIN, fige ?? 0));
        else if (fige != null) figerPiste(a, fige); else demarrerPiste(a, t0, now);
      }
      if (fige == null && !reduit) Sono.jouer(sons);
      racine.classList.add('pret');
      if (!raf) raf = requestAnimationFrame(boucle);
    }
    function passer() {
      if (fige != null || temps() >= FIN) return;
      const now = maintenant();
      t0 = now - FIN * 1000;
      // On saute à la fin par currentTime / finish() : changer startTime laisse parfois Chrome
      // afficher l'ancienne image des animations confiées au compositeur.
      for (const a of anims) {
        if (!estWaapi(a)) { demarrerPiste(a, t0, now); continue; }
        if (a.effect.getComputedTiming().endTime <= FIN * 1000) a.finish();
        else { a.currentTime = FIN * 1000; a.play(); }
      }
      Sono.couper(.25);
      if (sonFin) Sono.jouer(sonFin);
      // Après un saut, Chrome peut garder à l'écran l'image d'avant : on force un repeint, invisible à l'œil.
      document.body.style.opacity = '.999';
      requestAnimationFrame(() => requestAnimationFrame(() => { document.body.style.opacity = ''; }));
      if (!raf) raf = requestAnimationFrame(boucle);
    }

    if (sons) Sono.installer(jouer);
    addEventListener('pointerdown', (e) => {
      if (e.target.closest && e.target.closest('.commandes')) return;
      passer();
    }, { passive: true });
    addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
      if (e.target.closest && e.target.closest('.commandes')) return;
      const k = e.key.toLowerCase();
      if (k === 'r') jouer();
      else if (k === 'm' && sons) Sono.basculer();
      else if (k !== 'tab' && k !== 'shift') passer();
    });
    $('rejouer').addEventListener('click', jouer);
    let minuterie = 0;
    addEventListener('resize', () => {
      clearTimeout(minuterie);
      minuterie = setTimeout(() => {
        majEchelle();
        if (preparer) preparer(reduit, true);
        if (!raf) raf = requestAnimationFrame(boucle);
      }, 120);
    });

    window.aurora = {
      jouer,
      passer,
      aller(t) { fige = t; for (const a of anims) figerPiste(a, t); if (!raf) raf = requestAnimationFrame(boucle); },
      mesurerSon: () => Sono.mesurer(sons, FIN + 4),
    };

    (async () => {
      majEchelle();
      try { await Promise.race([document.fonts.load('600 62px "Familjen Grotesk"', 'Aurora'), attendre(1500)]); } catch { /* repli */ }
      if (document.hidden) await new Promise((r) => document.addEventListener('visibilitychange', r, { once: true }));
      jouer();
    })();
  }


  const T_SAUT = 1.15, T_SORTIE = 2.25;
  // La distance parcourue : dérive, petit recul de charge, accélération exponentielle, arrêt net.
  const GLSL = `
uniform vec2 u_centre;
uniform float u_k;
// a0 : x, y (disque), z de départ, graine — a2 : couleur, alpha — a3 : rayon
float distance_(float t) {
  float d = t * 60.;
  d -= 40. * smoothstep(.55, ${T_SAUT.toFixed(2)}, t) * (1. - smoothstep(${T_SAUT.toFixed(2)}, ${(T_SAUT + .1).toFixed(2)}, t));
  float w = clamp(t - ${T_SAUT.toFixed(2)}, 0., ${(T_SORTIE - T_SAUT).toFixed(2)});
  d += (exp(w * 4.2) - 1.) * 260.;
  float apres = max(t - ${T_SORTIE.toFixed(2)}, 0.);
  d += apres * 25.;
  return d;
}
Etat etat(float t) {
  Etat e; e.doux = .2; e.r = a3.x;
  float Z = 3000.;
  float z = mod(a0.z - distance_(t), Z) + 20.;
  float f = 520. * u_k / z;
  e.p = u_centre + a0.xy * f;
  float proche = 1. - z / Z;
  float vitesse = smoothstep(${T_SAUT.toFixed(2)}, ${(T_SAUT + .4).toFixed(2)}, t) * (1. - smoothstep(${T_SORTIE.toFixed(2)}, ${(T_SORTIE + .05).toFixed(2)}, t));
  e.c = mix(vec3(.92, .94, 1.), a2.rgb, vitesse * .85);
  e.a = a2.a * smoothstep(0., .25, proche) * smoothstep(0., .5, t - a0.w * .3) * (.55 + .45 * proche);
  e.r = a3.x * (.5 + proche * 1.6);
  e.a *= 1. - .6 * smoothstep(${T_SORTIE.toFixed(2)}, ${(T_SORTIE + .9).toFixed(2)}, t);
  return e;
}`;

  const el = elementsMarque();
  let P = null, geo = null;
  try { P = creerParticules($('toile'), { glsl: GLSL, uniformes: ['centre', 'k'], trainee: .028 }); }
  catch (err) { console.warn('Aurora : particules désactivées —', err.message); $('toile').hidden = true; }

  function construire() {
    geo = geometrieA(el.boiteA);
    const alea = hasard(31), W = innerWidth, H = innerHeight, n = Math.round(6500 * clamp(W * H / (1440 * 900), .5, 1.2));
    const L = lot(n);
    for (let i = 0; i < n; i++) {
      const a = alea() * 6.283, r = 30 + Math.sqrt(alea()) * 900;
      L.mettre(Math.cos(a) * r, Math.sin(a) * r, alea() * 3000, alea(), 0, 0, 0, 0, ...teinteMarque((a / 6.283 + alea() * .2) % 1), .9, .9 + alea() * .9, 0, 0, 0);
    }
    P.charger(L.f);
  }

  function sons(o, b) {
    o.ton(b, 55, { duree: 1.25, crete: .09, attaque: .6, type: 'sawtooth', filtre: 300, vers: 82, humide: .2, courbe: 'lin' });
    o.montee(b + .3, { duree: .85, crete: .13, f0: 150, f1: 3000 });
    o.impact(b + T_SAUT, { crete: .6, grave: 46, duree: 1.4 });
    o.souffle(b + T_SAUT, { duree: T_SORTIE - T_SAUT, f0: 900, f1: 3800, q: .4, crete: .14, attaque: .25, humide: .2, type: 'bandpass' });
    o.ton(b + T_SAUT, 110, { duree: T_SORTIE - T_SAUT, crete: .05, attaque: .3, type: 'sawtooth', filtre: 900, vers: 220, humide: .1, courbe: 'lin' });
    o.ton(b + T_SORTIE, 320, { duree: .5, crete: .25, attaque: .004, vers: 45, humide: .4 });
    o.souffle(b + T_SORTIE, { duree: .7, f0: 5000, f1: 300, type: 'lowpass', q: .4, crete: .14, attaque: .01, humide: .6 });
    o.signature(b + T_SORTIE + .25, 'synthe');
  }

  lancer({
    FIN: 3.6,
    sons,
    sonFin: (o, b) => o.signature(b + .05, 'synthe', .8),
    preparer(reduit) { if (P) { $('toile').hidden = reduit; if (!reduit) construire(); } },
    dessiner(t) { if (P && !$('toile').hidden) P.dessiner(t, (gl, u) => { gl.uniform2f(u.centre, innerWidth / 2, innerHeight * .45); gl.uniform1f(u.k, echelle()); }); },
    animer() {
      const L = revelerMarque(el, { a: T_SORTIE + .02, nom: T_SORTIE + .2, trait: T_SORTIE + .5, sous: T_SORTIE + .7, dureeA: .25 });
      const anim = (cible, kf, d, duree, easing) => L.push(cible.animate(kf, { delay: d * 1000, duration: duree * 1000, easing, fill: 'both' }));
      anim($('lueur'), [{ opacity: 0 }, { opacity: 1, offset: .25 }, { opacity: .8, offset: .85 }, { opacity: 0 }], T_SAUT, T_SORTIE - T_SAUT + .3, 'linear');
      anim($('eclair'), [{ opacity: 0 }, { opacity: .85, offset: .1 }, { opacity: 0 }], T_SORTIE - .02, .55, 'ease-out');
      anim(el.boiteA, [{ transform: 'scale(.6)', filter: 'blur(6px)' }, { transform: 'scale(1)', filter: 'blur(0px)' }], T_SORTIE, .6, 'cubic-bezier(.16,1,.3,1)');
      return L;
    },
  });
})();
</script>
</body>
